Capture.Fallback="No game: capture any full-screen app"
Capture.KeepReady="Keep capturing in other scenes"
Capture.KeepReady.Tip="Ticked: the capture carries on while you are on a scene that does not show it, so it is there at once when you come back.\nUnticked: OBS stops it a moment after you leave and starts it again when you return, which can cost a few frames at each scene switch."

Active.Name="Follow Active App (StageKit)"
Active.Status.None="Nothing to show yet: add the captures below."
Active.Status.Showing="Showing: %1"
Active.Status.Held="Showing: %1, switched to by hand. It stays until you hide it."
Active.ByHand="Captures you switch to"
Active.ByHand.Tip="Other captures in this scene that you show yourself, such as a window capture of your browser. Show one (a Stream Deck source key, OBS's show and hide hotkeys, or the eye in the Sources list) and it takes over and stays, whatever app you use. Hide it and the captures above follow your apps again. Showing one hides any other on this list. This filter also adds two hotkeys to the scene in Settings > Hotkeys: one steps through these captures and then back to the apps, one goes straight back to the apps."
Hotkey.Active.Next="StageKit: %1: next capture switched to by hand"
Hotkey.Active.Back="StageKit: %1: back to following the apps"
Active.Items="Captures to switch between"
Active.Items.Tip="Captures in this scene, one for each app. Which app a capture belongs to is read from the capture itself. Two captures of programs with the same file name are told apart by their window titles. The first in the list is shown when none of the apps is open."
Active.Follow="Follow the app in use"
Active.Follow.Tip="Ticked: clicking into one of the apps shows its capture. Clicking into anything else changes nothing, so the last one stays. Unticked: a capture is shown when its app opens and stays until that app closes."
Active.Ready="Keep the others ready"
Active.Ready.Tip="While this scene is showing, the captures of the other open apps keep running, so the one you switch to has its picture at once and the change is smooth. Untick to save some graphics memory."
Active.Help="Add this to a scene that has a capture for each of several apps, and list them. One is shown at a time. An app that opens is shown, and so is a capture you aim at another window. When the app that is showing closes, the one you used before it comes back; when none is open, the first in the list is shown. It acts only when one of those things happens, so a capture you show by hand stays until then. Windows only. A minimised window counts as closed."
