StageKit.Description="Quality-of-life tools for OBS: ramping blur, easy positioning and shared layouts, with hotkey and Stream Deck control."

RampBlur.Name="Source Filter: Blur (StageKit)"
RampBlur.Type="Blur type"
RampBlur.Type.Gaussian="Gaussian (smoothest)"
RampBlur.Type.Kawase="Dual Kawase (fastest)"
RampBlur.Type.Box="Box"
RampBlur.Type.Pixelate="Pixelate"
RampBlur.Type.Temporal="Temporal (trails)"
RampBlur.Type.Tip="Gaussian, Box and Dual Kawase soften the image. Pixelate cuts it into cells of a shape you choose. Radial and Motion smear it towards a point or along a line. Temporal leaves the image sharp and blurs it over time instead: whatever moves leaves a trail, and the strength is how long the trail lasts (100 is one second)."
Mosaic.Shape="Cell shape"
Mosaic.Square="Squares"
Mosaic.Hexagon="Hexagons"
Mosaic.Circle="Circles"
Mosaic.Triangle="Triangles"
Mosaic.Voronoi="Voronoi (uneven cells)"
Mosaic.Rhomboid="Rhomboids"
Mosaic.Triakis="Triakis (split triangles)"
Mosaic.Smooth="Smoothing"
Mosaic.Smooth.Tip="How far each cell's colour runs into its neighbours. 0: hard edges between cells."
Mosaic.Glass="Glass"
Mosaic.GlassStyle="Glass style"
Mosaic.GlassStyle.Rounded="Dome"
Mosaic.GlassStyle.Edges="Flat plate"
Mosaic.GlassStyle.Tip="The shape of each piece of glass. Dome: the cell is curved like a bead and shines across its whole face, with a glint. Flat plate: the face is flat and the cell has sharp bevelled edges that catch the light, like a cut plate of glass; squares and hexagons get straight facets. Used while Glass is above 0."
Mosaic.Glass.Tip="Makes each cell look like a small piece of glass: lit from the upper left, with a glint and a darker rim. 0: flat cells. It costs next to nothing to draw."
Mosaic.OriginX="Origin X"
Mosaic.OriginY="Origin Y"
Mosaic.Origin.Tip="The point of the image the pattern is laid out from and turned around. 50 and 50 is the middle."
Mosaic.Rotation="Rotation"
Mosaic.Edge="Mosaic edge"
Mosaic.Edge.Cut="Cut at the edge"
Mosaic.Edge.Whole="Whole cells"
Mosaic.Edge.Tip="How the cells meet the source's edge. Cut at the edge: the cells along it are cut straight, as the source's edge runs. Whole cells: a cell the edge would cut is left out, so the blurred source's outline is made of whole cells (hexagons, circles ...) and a shadow, glow, outline or Corners & Edges after this filter follows that outline. The image never grows past its own edge, so cells are only left out, never added."
RampBlur.Type.Zoom="Radial (zoom blur)"
RampBlur.Type.Motion="Motion (directional)"
RampBlur.Strength="Strength"
RampBlur.Strength.Tip="How strong the blur is. For Pixelate it sets the size of the cells; for Temporal, how long a trail lasts (100 is one second)."
RampBlur.Angle="Motion angle"
RampBlur.CenterX="Centre X"
RampBlur.CenterY="Centre Y"
RampBlur.LookGroup="Blur"
RampBlur.RampGroup="Timing"
RampBlur.AlsoGroup="Blur these too"
RampBlur.AlsoPick="Add a source"
RampBlur.Also.Tip="When this filter is switched on or off, these sources are blurred and cleared with it, so one Stream Deck key does them all. A source with no Blur of its own is given one with these settings."
RampBlur.AlsoCaptures="And live captures on screen"
RampBlur.AlsoCaptures.Tip="Also blurs every live capture showing in the scene on screen at the moment this filter is switched on: game, window, display and camera captures and capture cards, also one shown through a Cropped View, a group or a nested scene. Sources listed under Never blur these are left alone."
RampBlur.Never="Never blur these"
RampBlur.NeverPick="Add a source"
RampBlur.Never.Tip="Sources that 'And live captures on screen' leaves alone: your camera, say, so that it stays clear while everything else on screen is blurred. Any source can be listed. A Cropped View listed here (a camera's crop) also keeps the source it shows clear. A source listed under Blur these too is still blurred."
RampBlur.LedName="Blur (follows another)"
RampBlur.KeysGroup="Keys"
RampBlur.Style="Blur transition"
RampBlur.Style.Grow="Grow blur strength"
RampBlur.Style.Fade="Fade blurred image in"
RampBlur.RampIn="Blur-in duration"
RampBlur.RampOut="Blur-out duration"
RampBlur.IncludeInAll="Include in 'Blur All' hotkeys"
RampBlur.Button.Toggle="Blur on / off now"
RampBlur.Help="Turning this filter on or off ramps the blur in or out. Use StageKit's Blur key on a Stream Deck (or the OBS plugin's Filter key), the eye icon, a hotkey (Settings → Hotkeys, under this source: 'StageKit: this filter's name: toggle') or obs-websocket. While off, the filter costs nothing."

Hotkey.BlurToggle="StageKit: %1: toggle"
Hotkey.BlurOn="StageKit: %1: switch on"
Hotkey.BlurOff="StageKit: %1: switch off"
Hotkey.BlurAllToggle="StageKit: Blur All: toggle"
Hotkey.BlurAllOn="StageKit: Blur All: switch on"
Hotkey.BlurAllOff="StageKit: Blur All: switch off"

Ambient.Name="Ambient Background (StageKit)"
Ambient.Group.Picture="Image"
Ambient.BaseType="Background from"
Ambient.BaseType.Image="An image file"
Ambient.BaseType.StartImage="The standby image"
Ambient.BaseType.Source="An existing source or scene"
Ambient.Image="Image"
Ambient.BaseSource="Source"
Ambient.BaseType.Pattern="A pattern"
Ambient.Pattern="Pattern"
Ambient.Pattern.Tip="An animated background drawn by StageKit itself, with no image. It goes through everything below as an image does: the blur, the mosaic, bloom, Darkest level and a live capture blended in. The blur softens it a great deal: turn Blur strength down to see a pattern's shapes clearly. Drift, zoom and mirroring are an image's and do not apply."
Ambient.Pattern.Aurora="Aurora"
Ambient.Pattern.Plasma="Plasma"
Ambient.Pattern.Lava="Lava lamp"
Ambient.Pattern.Waves="Waves"
Ambient.Pattern.Bokeh="Bokeh"
Ambient.Pattern.Stars="Starfield"
Ambient.Pattern.Gradient="Gradient flow"
Ambient.Pattern.Nebula="Nebula"
Ambient.Pattern.Grid="Grid pulse"
Ambient.Pattern.Rays="Rays"
Ambient.Pattern.Circuit="Circuit board"
Ambient.Pattern.Hex="Hex grid"
Ambient.Pattern.Rain="Matrix rain"
Ambient.Pattern.Tunnel="Tunnel"
Ambient.Pattern.Ripples="Ripples"
Ambient.Pattern.Embers="Embers"
Ambient.Pattern.SunGrid="Sun grid"
Ambient.Pattern.CircuitTraces="Circuit traces"
Ambient.Pattern.DataLines="Data lines"
Ambient.Pattern.HexColumns="Hex columns"
Ambient.Pattern.Mesh="Mesh"
Ambient.Pattern.Halftone="Halftone hexagons"
Ambient.Pattern.DotGrid="Dot grid"
Ambient.Pattern.HexWire="Hex wire glow"
Ambient.Pattern.HexMosaic="Hex mosaic"
Ambient.PatternColour1="Colour 1"
Ambient.PatternColour2="Colour 2"
Ambient.PatternColour3="Colour 3"
Ambient.PatternColour.Tip="The pattern's three colours. Where a pattern has a ground (Lava lamp, Bokeh, Starfield, Grid pulse, Rays, Aurora, Hex grid, Matrix rain, Ripples, Embers, Sun grid), Colour 1 is the ground and the other two are what moves over it. Circuit board, Circuit traces and Data lines: Colour 1 is the board (dark or light), Colour 2 the lines and Colour 3 what lights up. Hex columns, Mesh, Halftone hexagons, Dot grid, Hex wire glow and Hex mosaic: Colour 1 is the ground (dark or light) and Colours 2 and 3 are what is lit or inked, one towards each side of the screen in Dot grid and Hex wire glow. The others run from Colour 1 through Colour 2 to Colour 3."
Ambient.PatternSpeed="Speed"
Ambient.PatternSpeed.Tip="How fast the pattern moves. 0 holds it still; under 0 it runs backwards. At 100% a pattern comes back to where it began every four minutes, with no jump."
Ambient.PatternScale="Size"
Ambient.PatternScale.Tip="How large the pattern's shapes are: the bands, blobs, circles, stars, grid or a circuit board's traces."
Ambient.PatternDetail="Detail"
Transform.PositionX="Position X"
Transform.PositionY="Position Y"
Ambient.Position.Tip="Moves the background's image, source or pattern across the screen, as a share of the screen's width (X) or height (Y). 0 leaves it where it is. An image fills the space it leaves by repeating or mirroring itself; a pattern's own layout is moved, so the centre of Rays or the horizon of Sun grid moves with it."
Ambient.Rotation.Tip="Turns the background's image, source or pattern about the middle of the screen, clockwise. An image still covers the whole screen: its corners are filled by repeating or mirroring it, and its drift stays in the direction set. A pattern's own layout is turned, so Circuit traces can come from a side instead of the top."
Ambient.PatternDetail.Tip="How much fine structure the pattern has: sharper edges, more stars, finer cloud, narrower rays, more traces in a circuit board's ribbons and, high up, chips and soldered pads, more bundles and lines, more drops and sparks, a brighter bevel on a hex column, more rings in a halftone hexagon, more beams over a dot grid, more contrast between a mosaic's tiles. Low is soft and plain."
Ambient.Live="Live capture"
Ambient.Live.None="No"
Ambient.Live.Auto="Automatic (largest capture)"
Ambient.Live.Source="A specific source"
Ambient.LiveSource="Live source"
Ambient.LiveOpacity="Live capture opacity"
Ambient.LiveFit="Live capture fit"
Ambient.LiveFit.Fill="Fill the screen (crop)"
Ambient.LiveFit.Fit="Fit inside the screen"
Ambient.LiveFit.Width="Match the width"
Ambient.LiveFit.Height="Match the height"
Ambient.LiveFit.Stretch="Stretch to the screen"
Ambient.LiveZoom="Live capture zoom"
Ambient.LiveReplace="Live capture replaces the image"
Ambient.LiveSkipStandby="Ignore a standby image"
Ambient.LiveSkipStandby.Tip="Ticked: while a Standby Image is standing in for the capture, there is no live capture to blend in, and the background shows its usual image. Unticked: the standby image is blended in as if it were the capture."
Ambient.LiveReady="Keep the capture ready"
Ambient.LiveReady.Tip="In scenes that show no capture, the capture last used is kept running out of sight, so it is there at once when you switch to a scene that does show it. Untick to let it stop, which saves a little work and costs a short wait at the switch."
Ambient.LiveReplace.Tip="While there is a live capture it is the whole background. The moment there is none, the usual image is back."
Ambient.Group.Motion="Motion"
Ambient.SpeedX="Drift right / left"
Ambient.SpeedY="Drift down / up"
Ambient.Zoom="Zoom"
Ambient.Mirror="Mirror at the edges"
Ambient.Group.Look="Look"
Ambient.Blur="Blur strength"
Ambient.Pixel="Mosaic"
Ambient.Pixel.None="None"
Ambient.Pixel.Hex="Hexagons"
Ambient.Pixel.Square="Squares"
Ambient.PixelSize="Cell size"
Ambient.Saturation="Saturation"
Ambient.Glow="Glow"
Ambient.BlurType.Tip="Dual Kawase, Gaussian and Box soften the image; they differ a little in look and Dual Kawase costs least. Temporal leaves the image sharp and blurs it over time instead: whatever moves leaves a trail, and Blur strength is how long the trail lasts (100 is one second)."
Ambient.BloomStyle="Bloom style"
Ambient.BloomStyle.Shine="Bright parts shine"
Ambient.BloomStyle.Amplify="Whole image, amplified"
Ambient.BloomStyle.Tip="Bright parts shine: only what is brighter than the threshold spreads its light. Whole image, amplified: the light of the whole image is added back onto it, which brightens everything and lets colours run into white. That is the look of obs-shaderfilter's bloom shader; 100% is its strength of 1, 500% its strength of 5."
Ambient.LiveChange="Capture transition"
Ambient.LiveChange.Tip="How the background follows when the capture blended in changes: another capture, no capture any more, or an Automatic Window Switcher taking another window. The background as it was gives way to the new one this way."
Ambient.LiveDelay="Capture delay"
Ambient.LiveDelay.Tip="How long the background stays as it was after the capture changes, before it starts to follow. Set it to the length of the capture's own transition to have the background change after the image has."
Ambient.Bloom="Bloom"
Ambient.Bloom.Tip="The bright parts of the image shine: their light spreads over what is around them. 0: off."
Ambient.BloomThreshold="Bloom threshold"
Ambient.BloomThreshold.Tip="How bright a part of the image must be to shine. Lower: more of the image shines."
Ambient.BloomSize="Bloom size"
Ambient.BloomSize.Tip="How far the light spreads, on the same scale as Blur strength. It always spreads at least as far as the blur, so the background stays as soft as it is set."
Ambient.Brightness="Brightness"
Ambient.Vignette="Vignette"
Ambient.Darkest="Darkest level"
Ambient.Darkest.Tip="How bright the darkest parts of the background become, even while the capture blended in is completely black. Toward the background image, black shows the image at this share of its brightness: 1% barely shows it, 10% is a dim image, 100% is the image itself. Toward a colour, black takes on the colour, this bright. Brighter parts are left as they are, with a smooth change between. The lift comes before the blur and the mosaic. 0: off."
Ambient.DarkestFill="Lift toward"
Ambient.DarkestFill.Image="The background image"
Ambient.DarkestFill.Colour="A colour"
Ambient.DarkestFill.Tip="What dark parts are lifted toward. The background image: the image (or source) the background is made from, where the background has it, dimmed to the level, so a black capture shows the usual background faintly. With nothing under Background from, the colour is used. A colour: dark parts take on the Lift colour, as bright as the level."
Ambient.DarkestColour="Lift colour"
Ambient.DarkestColour.Tip="The colour dark parts are lifted toward, at the brightness of Darkest level."
Ambient.Group.Overlay="Texture overlay"
Ambient.Overlay="Texture image"
Ambient.OverlayMode="Blend"
Ambient.OverlayMode.Multiply="Multiply (darken)"
Ambient.OverlayMode.Screen="Screen (lighten)"
Ambient.OverlayStrength="Texture strength"
Ambient.OverlayGray="Texture in black and white"

Shadow.Name="Source Filter: Shadow, Glow & Outline (StageKit)"
Shadow.Shadow="Shadow or glow"
Shadow.Type="Type"
Shadow.Type.Drop="Drop shadow (to one side)"
Shadow.Type.Glow="Glow (all round)"
Shadow.Fill="Colour source"
Shadow.Fill.Color="A colour"
Shadow.Fill.Picture="The image itself"
Shadow.Fill.Tip="'The image itself' uses the source's own colours as it plays: a game or camera casts a soft, moving copy of itself instead of a flat colour."
Shadow.Boost="Colour boost"
Shadow.Boost.Tip="Makes the image's colours richer and brighter in its shadow or glow."
Shadow.Outline="Outline"
Shadow.OutlineWidth="Outline width"
Shadow.OutlineColor="Outline colour"
Shadow.OutlineOpacity="Outline opacity"
Shadow.OutlineCorners="Outline corners"
Shadow.OutlineCorners.Follow="Follow the source"
Shadow.OutlineCorners.Round="Rounded"
Shadow.OutlineCorners.Cut="Bevel"
Shadow.OutlineCorners.Notch="Notch"
Shadow.OutlineCorners.Scoop="Scoop"
Shadow.OutlineCorners.Square="Square"
Shadow.OutlineCorners.Tip="The outline's outer corners. Follow the source: the line goes round the shape of what shows (text, odd shapes), its corners rounded by the line's width. The others draw the line round the rectangle the image covers on screen (its panel, if it has one): Square for sharp corners, or corners rounded, bevelled, notched or scooped, the size set below. Text, shaped and turned sources keep a line that follows them. The drop shadow takes the same shape."
Shadow.OutlineCornerSize="Corner size"
Shadow.OutlineCornerSize.Tip="How big the outline's outer corners are, in pixels. The line always covers the source's own corners, so a corner is never made larger than that allows (for a rounded corner, about three and a half times the line's width). To round the source itself, add a Corners & Edges filter before this one."
Shadow.OutlineDesign="Outline design"
Shadow.OutlineDesign.Solid="Solid"
Shadow.OutlineDesign.Double="Double line"
Shadow.OutlineDesign.Dashed="Dashed"
Shadow.OutlineDesign.Dotted="Dotted"
Shadow.OutlineDesign.Gradient="Gradient"
Shadow.OutlineDesign.Neon="Neon"
Shadow.OutlineDesign.Inner="Inner line"
Shadow.OutlineDesign.Marching="Marching dashes"
Shadow.OutlineDesign.Travelling="Travelling gradient"
Shadow.OutlineDesign.Pulse="Pulse"
Shadow.OutlineDesign.Shimmer="Shimmer"
Shadow.OutlineDesign.Rainbow="Rainbow"
Shadow.OutlineDesign.Aurora="Pattern: Aurora"
Shadow.OutlineDesign.Plasma="Pattern: Plasma"
Shadow.OutlineDesign.Lava="Pattern: Lava lamp"
Shadow.OutlineDesign.Waves="Pattern: Waves"
Shadow.OutlineDesign.Nebula="Pattern: Nebula"
Shadow.OutlineDesign.Flow="Pattern: Gradient flow"
Shadow.OutlineDesign.Stars="Pattern: Starfield"
Shadow.OutlineDesign.Bokeh="Pattern: Bokeh"
Shadow.OutlineDesign.Rays="Pattern: Rays"
Shadow.OutlineDesign.Circuit="Pattern: Circuit board"
Shadow.OutlineDesign.Hex="Pattern: Hex grid"
Shadow.OutlineDesign.Rain="Pattern: Matrix rain"
Shadow.OutlineDesign.Tunnel="Pattern: Tunnel"
Shadow.OutlineDesign.Ripples="Pattern: Ripples"
Shadow.OutlineDesign.Embers="Pattern: Embers"
Shadow.OutlineDesign.Tip="How the line is drawn. Solid: the plain line. Double line: two thin lines with a gap. Dashed and Dotted: pieces of line with gaps. Gradient: the outline colour changing into the second colour round the border. Neon: a bright tube with a halo of light spreading out past the line; pick a bright colour. Inner line: drawn just inside the image's edge; it needs Outline corners other than Follow the source. Marching dashes, Travelling gradient, Pulse, Shimmer and Rainbow move. The designs called Pattern fill the line with one of Ambient Background's moving patterns in the outline, second and third colours. Ambient Background fills it with what an Ambient Background shows, live. The drop shadow is still thrown by the whole line. The guide says how each design is laid round a source."

Shadow.OutlineDesign.CircuitTraces="Pattern: Circuit traces"
Shadow.OutlineDesign.DataLines="Pattern: Data lines"
Shadow.OutlineDesign.Mesh="Pattern: Mesh"
Shadow.OutlineDesign.Halftone="Pattern: Halftone"
Shadow.OutlineDesign.DotGrid="Pattern: Dot grid"
Shadow.OutlineDesign.HexWire="Pattern: Hex wire glow"
Shadow.OutlineDesign.HexMosaic="Pattern: Hex mosaic"
Shadow.OutlineDesign.Ambient="Ambient Background"
Shadow.OutlineAmbient="Background"
Shadow.OutlineAmbient.Auto="Automatic"
Shadow.OutlineAmbient.Tip="Which Ambient Background the line shows. Automatic takes the one in the scene (for the source filter: in the scene on screen), or failing that any there is. The line shows whatever that background shows: its pattern, image or live capture, with its blur, mosaic, bloom and transitions. With no Ambient Background the line is its outline colour."
Shadow.OutlineAmbientBright="Fill brightness"
Shadow.OutlineAmbientBright.Tip="How much brighter than the background the line is. At 100% the line is exactly the background and cannot be told from it where the two meet."
Shadow.OutlineAmbientSat="Fill saturation"
Shadow.OutlineAmbientSat.Tip="How rich the line's colours are beside the background's: 100% as they are, 0% grey."
Shadow.OutlineColor2="Second colour"
Shadow.OutlineColor2.Tip="The colour the gradient changes into, the colour of Shimmer's highlight, and a pattern's second colour. Neon uses it for its halo only when the outline colour is very dark."
Shadow.OutlineColor3="Third colour"
Shadow.OutlineColor3.Tip="A pattern's third colour. The outline colour is its first, and the ground of the patterns that have one (Aurora, Lava lamp, Starfield, Bokeh, Rays, Hex grid, Matrix rain, Ripples, Embers) and the board of Circuit board, Circuit traces and Data lines; their lines are the second colour and what lights up the third. Mesh, Halftone, Dot grid, Hex wire glow and Hex mosaic: the outline colour is the ground, and the second and third colours are what is lit or inked."
Shadow.OutlinePatternScale="Pattern size"
Shadow.OutlinePosition.Tip="Moves the pattern inside the line, as a share of the width (X) or height (Y) of the area the pattern covers. The line itself stays where it is. 0 leaves the pattern as it is."
Shadow.OutlineRotation.Tip="A pattern: turns it inside the line, clockwise. Gradient, Travelling, Shimmer and Rainbow: where round the border the colours begin (180 puts the first colour at the opposite corner). Dashed and Marching: slides the dashes along the line, a whole turn being one dash and gap. The line's shape does not change."
Shadow.OutlinePatternScale.Tip="How large the pattern in the line is. Smaller shows more of it along a thin line (a circuit board's traces and lights, say); 100% is the size it has as an Ambient Background. The Ambient Background fill: how large the background is in the line, 100% as the screen shows it."
Shadow.OutlineDash="Dash length"
Shadow.OutlineGap="Gap length"
Shadow.OutlineSpeed="Speed"
Shadow.OutlineSpeed.Tip="How fast the design moves. 0 stands still; a negative number goes the other way. For Marching dashes it is pixels a second; for Travelling gradient, Shimmer and Rainbow, 60 is one round every ten seconds; for Pulse, 100 is one pulse a second; for a pattern, 60 is the speed it has as an Ambient Background."
Shadow.OutlineNeon="Glow size"
Shadow.OutlineNeon.Tip="How far the neon's halo of light reaches past the line, in per cent of the outline's width. Pick a bright outline colour: the halo is light of that colour, and a black or very dark line has none to give (it then takes the Second colour, if that is brighter)."
Shadow.Intensity="Intensity"
Shadow.Intensity.Tip="How dense the shadow or glow is. 100% is as it was; more fills its soft tail in towards full colour without giving it a hard edge, for a bright glow; less makes it fainter."
Shadow.OutlineEdge="Past the edge"
Shadow.OutlineEdge.Stretch="Stretch the edge"
Shadow.OutlineEdge.Mirror="Mirror the image"
Shadow.OutlineEdge.Tip="What fills the outline when it is made from the image: the image's edge colours carried straight outwards, or the image mirrored at each edge like a reflection."
Shadow.OutlineBlur="Outline blur"
Shadow.OutlineBlur.Tip="How soft the image is inside the outline. 0 keeps it sharp; higher numbers melt it into a soft frame of the image's colours."
Shadow.Color="Colour"
Shadow.Opacity="Opacity"
Shadow.OffsetX="Right / left"
Shadow.OffsetY="Down / up"
Shadow.Softness="Softness"
Shadow.Spread="Strength"
Shadow.HideSource="Hide the image"
Shadow.Backdrop="Panel behind the source"
Shadow.BackdropColor="Panel colour"
Shadow.BackdropOpacity="Panel opacity"
Shadow.BackdropPad="Panel margin"
Shadow.Radius="Rounded corners"
Shadow.OffIn="Leave it off in these scenes"
Shadow.OffIn.Tip="While one of these scenes is on screen this filter draws nothing: no shadow, glow, outline or panel. The source shows plain there, and everything is back in the other scenes. Choose from the scenes in your collection."
Shadow.InView="Keep it on screen"
Shadow.InView.Tip="When a source reaches the edge of the canvas, its shadow, glow or outline would be cut off there. Ticked: the source is made a little smaller instead, by just enough for the whole effect to show, and stays against that edge. It acts once the source has been still for a moment, so it does not get in the way of a drag or a glide; a source whose image is itself partly off the canvas is left alone. With Fit to Space, an image that fills the screen makes room for its shadow."
Shadow.ScreenPx="Sizes in screen pixels"
Shadow.ScreenPx.Tip="Ticked: 20 px of shadow is 20 px in the finished image however much the source is scaled, so every source's shadow matches. Unticked: sizes are in the source's own pixels and shrink or grow with it."
Shadow.Keep="Keep the image where it is"
Shadow.Keep.Tip="The shadow needs room around the source. Ticked: the source is adjusted by that room in every scene it is in, so the image keeps its size and place whatever the shadow settings."

Place.Name="Scene Filter: Move Scene Item (StageKit)"
Place.Item="Source to move"
Place.Item.Tip="The source in this scene that this filter moves."
Place.Linked="Linked source"
Place.Linked.Tip="Another source in the scene that goes along with this one, keeping its place beside it: a name plate with a camera, say. (none): the source moves alone."
Place.Linked.None="(none)"
Place.FlipLinked="Flip sides to stay on screen"
Place.FlipLinked.Tip="Ticked: when the linked source would end up off the screen, it changes to the other side of the source it goes with."
Place.Destination="Destination"
Place.Destination.Tip="Where the source goes. A corner, a side or the centre of the screen, the gap below away from the edge. Saved position: the place (and, if ticked, the size) saved with 'Save current position', the source's own position in its scene. Screen position: its top left at the two numbers below, in screen pixels, which is the same spot of the screen in every scene, in a group or not."
Place.TopLeft="Top left"
Place.TopCenter="Top centre"
Place.TopRight="Top right"
Place.MiddleLeft="Middle left"
Place.Center="Centre"
Place.MiddleRight="Middle right"
Place.BottomLeft="Bottom left"
Place.BottomCenter="Bottom centre"
Place.BottomRight="Bottom right"
Place.Saved="Saved position"
Place.Margin="Gap"
Place.Margin.Tip="How far from the screen's edge the source stops at a corner or a side."
Place.SavedX="Saved position X"
Place.SavedY="Saved position Y"
Place.Saved.Tip="The source's own position, in pixels, as OBS's Edit Transform shows it. 'Save current position' fills it in."
Place.Spot="Screen position"
Measure.Visible="Use visible pixels"
Measure.Visible.Tip="Ticked: the gap is measured to the image you can see.\nUnticked: it is measured to the source's box, as OBS shows it.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Measure.NoShadows="Ignore shadows && outlines"
Measure.NoShadows.Tip="Ticked: a shadow, glow or outline does not count as part of the source, so it may reach closer to the edge.\nUnticked: the effect keeps the gap too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Place.SpotX="Left edge at"
Place.SpotY="Top edge at"
Place.Spot.Tip="Where the source's top left corner goes, in screen pixels from the top left of the screen."
Place.RestoreSize="Restore its size too"
Place.RestoreSize.Tip="Ticked: with Saved position, the source is also given the size it had when the position was saved."
Place.Capture="Save current position"
Place.Capture.Tip="Saves where the source is now, and its size, and sets Destination to Saved position."
Place.Duration="Duration"
Place.Duration.Tip="How long the move takes. 0 moves at once."
Place.Go="Move it now"
Place.Go.Tip="Moves the source now, as switching the filter on does."
Place.Help="Add this filter to a scene, once per destination. Switching it on moves the source, then it switches itself off again. Trigger it from StageKit's Move Scene Item key on a Stream Deck (or the OBS plugin's Filter key), the eye icon, or its hotkey (Settings → Hotkeys, under this scene)."
SendTo.Name="Source Filter: Move Source (StageKit)"
SendTo.Where="Move it in"
SendTo.Where.OnScreen="Only the scene on screen"
SendTo.Where.Every="Every scene it is in"
SendTo.Where.Chosen="Only one scene I choose"
SendTo.Where.Scene="Scene"
SendTo.Where.Tip="Every scene: the source ends up in the same place in each scene it is in, on screen or not. Only the scene on screen: other scenes keep their own arrangement. Only one scene: always that scene, whichever is on screen."
SendTo.Help="Add this filter to the source you want to move, such as your camera, once per position. Choose a corner, or drag the source where you want it in the preview and press 'Save current position'. Switching the filter on moves the source there, then it switches itself off again. On a Stream Deck, use StageKit's Move Source key (or the OBS plugin's Filter key: pick this source and this filter). Name each filter after its position so the keys are easy to tell apart."
Hotkey.Place="StageKit: %1: move"

Zoom.Name="Source Filter: Zoom (StageKit)"
Zoom.Amount="Zoom"
Zoom.Amount.Tip="How far the image is zoomed in while the filter is on. 100% is no zoom; 200% shows it twice as large."
Zoom.CenterX="Centre X"
Zoom.CenterY="Centre Y"
