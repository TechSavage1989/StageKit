Standby.Style.WipeRight="Wipe right"
Standby.Style.WipeUp="Wipe up"
Standby.Style.WipeDown="Wipe down"
Standby.Style.Zoom="Fade and zoom"
Standby.Style.Morph="Morph"
Standby.Style.Tip="Used while the source is shown but has nothing to show (no game or window attached, no camera signal): how the image gives way to the source when it starts. A slide or a wipe is named for the way the image leaves: with Slide left it goes off to the left. It comes back the same way in reverse when the source stops. Hiding and showing the source in a scene uses Show/Hide transition below instead."
Standby.Fade="Duration: image to capture"
Standby.Fade.Tip="How long the change from the image to the source takes."
Standby.Back="Duration: capture to image"
Standby.Back.Tip="How long the change back to the image takes when the source stops."
Standby.GlideSize="Animate the size change"
Standby.GlideSize.Tip="Ticked: the size glides between the image's shape and the source's over the same time. Unticked: the size changes at once and only the image changes over."
Standby.Cover="Cover the source now"
Standby.Cover.Tip="Brings the image in over a source that is running, and takes it away again: a way to hide the source without leaving a hole. It works on any source: a capture, a camera, a capture card. The same cover is this filter's hotkey (cover or uncover), the Stream Deck Standby Image key, and what Hide shows Standby Image does in Auto Capture, the Automatic Window Switcher and Show in Scenes."
Standby.Help="On a capture, camera or other live source. While it is on, the standby image is shown in the source's place whenever the source has no image."
