Shadow.InView.Tip="When an item reaches the edge of the canvas, its shadow, glow or outline would be cut off there. Ticked: the item is made a little smaller instead, by just enough for the whole effect to show, and stays against that edge. It acts once the item has been still for a moment, so it does not get in the way of a drag or of an item gliding in; an item whose picture is itself partly off the canvas is left alone. With Fit to Space, a picture that fills the screen makes room for its shadow."
