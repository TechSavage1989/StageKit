Standby.Style.WipeUp="Wipe upwards"
Standby.Style.WipeDown="Wipe downwards"
Standby.Style.Zoom="Zoom and fade"
Standby.Style.Tip="How the picture gives way to the capture when it starts. It comes back the same way in reverse when the capture ends."
Standby.Fade="To the capture"
Standby.Fade.Tip="How long the change from the picture to the capture takes."
Standby.Back="Back to the picture"
Standby.Back.Tip="How long the change back to the picture takes when the capture ends."
Standby.GlideSize="Size glides too"
Standby.GlideSize.Tip="Ticked: the size glides between the picture's shape and the capture's over the same time. Unticked: the size changes at once and only the picture changes over."
Standby.Help="Put this on a Game Capture, Window Capture or other live source. While nothing is captured (no game or window is attached), the picture is shown in its place, so there is no empty hole in the scene. When the capture starts, the picture's shape glides to the capture's shape as it fades into it; when the capture ends, it glides back. A capture that is attached and showing black is left alone. Switch this filter off with its eye, or a Stream Deck filter key, to go without the picture."
