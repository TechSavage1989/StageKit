Shadow.ScreenPx.Tip="With this on, 20 px of shadow is 20 px in the finished picture however much the item is scaled, so every item's shadow matches. With it off, sizes are in the source's own pixels and shrink or grow with the item."
Shadow.Keep="Keep the picture where it is"
Shadow.Keep.Tip="The shadow needs room around the source. With this on, the source's items in every scene are adjusted by that room, so the picture keeps its size and place whatever the shadow settings."

