ShowIn.WithLinked.Tip="Ticked: the items these sources bring along are shown and hidden with them.\nThose are the items chosen under 'Bring along' in the sources' Move Source keys, and in Move Scene Item filters that move them.\nUnticked: only the sources listed."
ShowIn.ApplyNow="Do it now"
ShowIn.Help="One switch for showing and hiding sources across scenes. Make a Stream Deck Filter key for this source and this filter: each press switches the filter on or off, and the sources are shown or hidden in the scenes chosen. It acts when it is switched, so anything you show or hide by hand stays until the next press."
