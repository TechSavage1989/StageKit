StartImage.Name="Standby Image (StageKit)"
StartImage.File="Standby image"
StartImage.Help="Shows the standby image: one image for the whole scene collection, chosen here or in the StageKit dock."

Capture.Name="Source Filter: Auto Capture (StageKit)"
Capture.Help="On a Game Capture. While it is on, the capture is aimed at the game in front by itself. Windows only."
Capture.Status.Now="Now capturing: %1"
Capture.Status.Waiting="Aimed at %1, which shows no image yet. A game running in it is captured as soon as it draws."
Capture.Status.None="Waiting for a game. Start one and bring it to the front; there is nothing to set up."
Capture.NeverNow="Never capture this program"
Capture.Check="Check again"
Capture.NeverNow.Tip="Puts the program being captured now on Never capture, for when something that is not a game was taken for one."
Capture.Check.Tip="Looks again at what is captured now and updates the line above."
Capture.Lists="Games"
Capture.NoGameGroup="When there is no game"
Capture.Never="Never capture"
Capture.Never.Tip="Programs to leave alone. Part of the file name or of the window's title is enough, for example: blender."
Capture.Always="Always capture"
Capture.Always.Tip="Optional. Games it does not find by itself. Part of the file name or of the window's title is enough."
Capture.Mode="Find games"
Capture.Mode.Tip="Automatically: any program in front that looks like a game is captured; there is no list to keep. Never capture is for mistakes.\nOnly from 'Always capture': nothing is captured but the programs on that list."
Capture.Mode.AnyGame="Automatically"
Capture.Mode.ListedOnly="Only from 'Always capture'"
Capture.Fallback="No game: any full-screen app"
Capture.Fallback.Tip="Ticked: while no game is found, the capture takes whatever application is full-screen in front, so a full-screen program it does not take for a game is still shown.\nUnticked: with no game the capture shows nothing (or the Standby Image, with the option below)."
Capture.KeepReady="Keep the capture ready"
Capture.NoGameStandby="No game: Standby Image"
Capture.NoGameStandby.Tip="Needs a Standby Image filter on this capture. Ticked: while no game is captured, the Standby Image is shown over the capture (also over a full-screen app it falls back to), with the transition set below. When a game is found, the Standby Image gives way to it."
Capture.HideStandby.Tip="Ticked, with a Standby Image filter on this capture: hiding the capture (the hotkey, the button, or the Stream Deck Manual Window / Source key set to Hide) brings the Standby Image in over it, and showing it takes the image away. Nothing around it moves. Without a Standby Image, or unticked, the capture is hidden in every scene it shows in, and the next press shows it again only there.\nThe Standby Image's own Show when source is hidden is another thing: it stands in whenever anything hides the source in a scene."
Capture.StandbyStyle.Tip="Choose how Auto Capture covers and uncovers the capture. As the Standby Image sets uses that filter's own transition and timing."
Capture.StandbyOwn="As the Standby Image sets"
Capture.ItemHide="When hiding scene sources"
Capture.HideNow.Tip="Hides the capture, or shows it again: what the hotkey and the Stream Deck Manual Window / Source key set to Hide do. With Hide shows Standby Image and a Standby Image filter on the capture, the image covers it instead."
Capture.StandbyMs.Tip="How long the Standby Image takes to come in or go when this filter shows it. Not used by a cut."
Standby.Name.Short="Standby Image"
Standby.WhenHidden="Show when source is hidden"
Standby.WhenHidden.Tip="While this source is hidden in a scene, the standby image is shown in its place there: the same position and size, with this source's shadow, corners and the other filters after this one. StageKit puts a locked stand-in under each copy of the source and shows and hides it by itself. The Show/Hide transition below is the change between the source and the standby image, whatever hides the source. With Morph the one changes into the other."
Standby.StandIn="Standby stand-in (StageKit)"
Standby.StandIn.Suffix="(standby)"
Capture.KeepReady.Tip="Ticked: the capture is kept running while you are on a scene that does not show it, so it is there at once when you come back.\nUnticked: OBS stops it a moment after you leave and starts it again when you return, which can cost a few frames at each scene switch."

AppCapture.Name="Source Filter: Automatic Window Switcher (StageKit)"
AppCapture.Help="On a Window Capture. While it is on, the capture shows whichever of the listed windows is in use. Windows only."
AppCapture.Status.None="The capture is not aimed at a window yet."
AppCapture.Status.Held="Capturing: %1, a manual window. It stays until you return to automatic."
AppCapture.Group.Manual="Manual windows"
AppCapture.Group.Switching="Switching"
AppCapture.Group.Windows="Windows"
AppCapture.ByHand="Manual windows"
AppCapture.ByHand.Tip="Other windows this capture can show when you say so, such as your browser. Switch to next manual window takes the next of them that is open and holds it, whatever window is active; after the last, or with Return to automatic, the windows above are followed again. The capture has five hotkeys in Settings → Hotkeys: next manual window, return to automatic, toggle manual / automatic, hide or show the capture, and clear picked windows. The Stream Deck Manual Window / Source key does the same."
AppCapture.ByHand.Toggle="Toggle manual / automatic"
AppCapture.ByHand.Toggle.Tip="Back to automatic from a manual window, or on to the manual window held last. Also this capture's hotkey 'toggle manual / automatic' and the Toggle step of the Stream Deck Manual Window / Source key."
AppCapture.ByHand.Next="Switch to next manual window"
AppCapture.ByHand.Next.Tip="Shows the next of the Manual windows that is open and holds it; after the last one the capture returns to automatic. Also this capture's hotkey 'next manual window' and the Next step of the Stream Deck Manual Window / Source key."
AppCapture.ByHand.Back="Return to automatic"
AppCapture.ByHand.Back.Tip="Lets go of the manual window: the capture follows the Windows to switch between again. Also this capture's hotkey 'return to automatic' and the Back step of the Stream Deck Manual Window / Source key."
AppCapture.ByHand.Clear="Clear picked windows"
AppCapture.ByHand.Clear.Tip="Takes the windows you picked with Capture Active Window off both lists, Windows to switch between and Manual windows. Programs and titles you added yourself stay. If a picked window is being shown, the capture goes on to the next automatic window, or shows the Standby Image if none is open. Also a hotkey under the capture, and the Stream Deck Manual Window / Source key set to Clear picked windows."
AppCapture.ClearPicked="Clear picked windows at start"
AppCapture.ClearPicked.Tip="Ticked: windows picked with Capture Active Window are only kept for this OBS session, and are gone the next time OBS starts (or this scene collection is loaded again). Unticked, they stay on the list, and are found again by their program and exact title."
AppCapture.Picked="When a window is picked"
AppCapture.Picked.Wait="Wait until switched to"
AppCapture.Picked.Now="Switch at selection"
AppCapture.Picked.Tip="For a window picked with the Stream Deck Capture Active Window key. Wait until switched to: it becomes the manual window and is captured in the background, while the capture goes on showing your automatic windows; it is shown when you switch to it (Manual Window / Source: Toggle or Next). Switch at selection: the capture changes to it straight away."
AppCapture.HandFollow="Auto-switch manual windows"
AppCapture.HandFollow.Tip="While a manual window is shown, the capture follows among your Manual windows the way it follows among the Windows to switch between: it changes to the manual window you click into or that opens, and back to the one before when the one shown closes. Windows that are not on the Manual windows list are never taken. Unticked, the manual window shown stays until you switch."
AppCapture.Ready="Keep other windows captured"
AppCapture.Ready.Tip="While this capture is showing, the other open apps on the two lists are captured in the background, so the one you switch to is there at once and the change is between two live images. Untick to save graphics memory; a switch then waits for the capture to find the other window."
AppCapture.GameArea="Game area only"
AppCapture.GameArea.Tip="Shows only the part of the window the app draws its game in: an emulator's menu bar, tool bar and status bar are left out, found by itself for each window and followed when it changes. Needs Window Capture's Client area ticked. Where no such part is found the window is shown whole, and OBS's log says what was found."
AppCapture.Change.Morph="Morph"
AppCapture.Hide="Show/Hide transition"
AppCapture.Hide.Now="Hide/show capture now"
AppCapture.Hide.With.Tip="Transition and Duration are for hiding and showing the capture's sources in the scenes. They are not used while Hide shows Standby Image is ticked and the capture has a Standby Image filter: the image then covers the capture with its own transition."
AppCapture.Hide.Now.Tip="Hides the capture, or shows it again. Also this capture's hotkey 'hide or show the capture' and the Hide step of the Stream Deck Manual Window / Source key."
AppCapture.HideStandby="Hide shows Standby Image"
AppCapture.HideStandby.Tip="Ticked, with a Standby Image filter on this capture: hiding the capture (the hotkey, the button, or the Stream Deck Manual Window / Source key set to Hide) brings the Standby Image in over it, the way that filter is set to change, and showing it takes the image away. Nothing around it moves. Without a Standby Image, or unticked, the capture is hidden in every scene it shows in, and the next press shows it again only there.\nThe Standby Image's own Show when source is hidden is another thing: it stands in whenever anything hides the source in a scene."
Hotkey.Standby.Cover="StageKit: %1: cover or uncover"
Hotkey.AppCapture.Next="StageKit: %1: next manual window"
Hotkey.AppCapture.Back="StageKit: %1: return to automatic"
Hotkey.AppCapture.Hide="StageKit: %1: hide or show the capture"
Hotkey.AppCapture.Toggle="StageKit: %1: toggle manual / automatic"
Hotkey.AppCapture.Clear="StageKit: %1: clear picked windows"
AppCapture.Status.Now="Capturing: %1"
AppCapture.Status.Nothing="Capturing nothing: none of the listed windows is open."
AppCapture.Apps="Windows to switch between"
AppCapture.Apps.Add="Add a window"
AppCapture.Ignore="Ignored windows"
AppCapture.Ignore.Tip="Windows this capture never takes, whatever they answer to in the lists above: by program, or by part of a window's title. For a window that would otherwise match, such as a second window with the same word in its title."
AppCapture.Apps.Tip="The apps this one Window Capture is for. Open the app, then choose it here: by its program, or by a window's title for two programs with the same file name. An app that opens is captured. When the app being captured closes, the one you used before it comes back."
AppCapture.Follow="Switch to the active window"
AppCapture.Follow.Tip="Ticked: clicking into one of the apps captures it. Clicking into anything else changes nothing, so the last one stays. Unticked: an app is captured when it opens and stays until it closes."
AppCapture.Change="Switch transition"
AppCapture.ChangeTime="Switch duration"
AppCapture.Change.Fade="Fade"
AppCapture.Change.Cut="Cut"
AppCapture.Change.Zoom="Fade and zoom"
AppCapture.Change.FromLeft="Slide right"
AppCapture.Change.FromRight="Slide left"
AppCapture.Change.FromTop="Slide down"
AppCapture.Change.FromBottom="Slide up"
AppCapture.Change.Tip="How one window's image gives way to the next when the capture switches. The last image stays until the capture has the new window, and the new one comes in over it this way. A slide is named for the way the image moves: with Slide left the new window comes in from the right. Hiding and showing the capture uses Show/Hide transition below instead."
Active.Name="Scene Filter: Automatic Source Switcher (StageKit)"
Active.Status.None="Nothing to show yet: add the captures below."
Active.Status.Showing="Showing: %1"
Active.Status.Held="Showing: %1, switched to by hand. It stays until you hide it."
Active.ByHand="Manual sources"
Active.ByHand.Tip="Other captures in this scene that you show yourself, such as a window capture of your browser. Show one (a Stream Deck key, OBS's show and hide hotkeys, or the eye in the Sources list) and it takes over and stays, whatever window is active. Hide it and the captures above follow your windows again. Showing one hides any other on this list. This filter also adds three hotkeys to the scene in Settings → Hotkeys: next manual source, return to automatic, and toggle manual / automatic."
Hotkey.Active.Next="StageKit: %1: next manual source"
Hotkey.Active.Back="StageKit: %1: return to automatic"
Hotkey.Active.Toggle="StageKit: %1: toggle manual / automatic"
Active.Items="Sources to switch between"
Active.Items.Tip="Captures in this scene, one for each app. Which app a capture belongs to is read from the capture itself. Two captures of programs with the same file name are told apart by their window titles. The first in the list is shown when none of the apps is open."
Active.Follow="Switch to the active window"
Active.Follow.Tip="Ticked: clicking into one of the apps shows its capture. Clicking into anything else changes nothing, so the last one stays. Unticked: a capture is shown when its app opens and stays until that app closes."
Active.Ready="Keep other sources ready"
Active.Ready.Tip="While this scene is showing, the captures of the other open apps keep running, so the one you switch to has its image at once and the change is smooth. Untick to save some graphics memory."
Active.ToggleNow="Toggle manual / automatic"
Active.NextNow="Next manual source"
Active.BackNow="Return to automatic"
