Modes.GoTo="Switch to scene"
Modes.GoTo.Stay="Stay in this scene"
Modes.GoTo.Tip="When a key or a hotkey turns this mode on, OBS then changes to this scene with its current transition (in Studio Mode, the preview changes). Nothing changes while the scene on screen is this filter's scene or one under 'Same modes in scenes'.\n'Mode now' in this window never changes scene."
Modes.Sources="Sources"
Modes.Sources.Add="Add a source"
Modes.Sources.Tip="Sources shown while this mode is on and hidden while another mode is on. A source in two modes stays shown when changing between them. Sources inside groups, and groups, can be chosen too. Sources in no mode are never touched."
Modes.Hide="Hide when on"
Modes.Hide.Tip="Sources hidden in this scene when this mode comes on, with the mode's transition. They are not part of the mode: when another mode comes on they are not shown again, and nothing else is done to them. Use it for a source that must never be shown with this mode, for example a full-screen camera over a column of game windows."
Modes.LeaveOn="Leave when shown"
Modes.LeaveOn.Tip="While this mode is on, showing one of these sources (by a key, another filter or the eye) turns this mode off and the mode under 'Leave to' on. The source that was shown stays shown, even when the next mode would hide it."
Modes.LeaveTo="Leave to"
Modes.LeaveTo.Before="The mode before"
Modes.LeaveTo.None="No mode"
Modes.LeaveTo.Tip="The mode turned on when a source under 'Leave when shown' is shown.\nThe mode before: the one that was on before this one (no mode if there is none and no mode is allowed).\nNo mode: only when 'Allow no mode' is ticked; otherwise this mode stays on."
Modes.MoveUp="Move up"
Modes.For="Settings for"
Modes.For.Tip="The mode whose settings are shown below. Only one mode's settings show at a time, so the settings for every mode, under them, are in reach."
Modes.Place="Placed in this mode"
Modes.Place.Tip="Sources put in a place of their own when this mode comes on: where they are, their size, crop and bounding box. They need not be sources of the mode: a widget shown in several modes can sit beside the chat in one and under the game windows in another. Turn the mode on, arrange these sources by hand, then press 'Save their places now'. A source with nothing saved for this mode is left where it is. A Fit to Space or Scene Fit on the source takes it where it was put, but may still adjust it by its own rules."
Modes.PlaceSave="Save their places now"
Modes.PlaceSave.Tip="Keeps, for this mode, where each source listed under 'Placed in this mode' is now, in this scene and in the scenes under 'Same modes in scenes'. Press it again after moving them to keep the new places."
Modes.PlaceMs="Move duration"
Modes.PlaceMs.Tip="How long the sources take to glide to their places when this mode comes on. 0 moves them at once. In a scene not on screen, and for a hidden source, the move is always at once."
Modes.Remove="Remove mode"
Modes.Remove.Tip="Takes this mode off. Its sources are left as they are."
Modes.AllowNone="Allow no mode"
Modes.AllowNone.Tip="Ticked: a Toggle key pressed on the mode that is on turns every mode off, hiding all their sources, and there is a 'no mode' hotkey.\nUnticked: a Toggle key goes back to the mode before."
Modes.Share="Same modes in scenes"
Modes.Share.Tip="These scenes follow this filter's mode: the same sources are shown and hidden in them too. A key pressed while one of them is on screen does not change scene. Use it for keys that work in two layouts alike."
Modes.LockHidden="Lock hidden sources"
Modes.LockHidden.Tip="Ticked: each source of a mode is locked while it is hidden and unlocked when it is shown, so a click in OBS's preview cannot pick a hidden source stacked under the one you see.\nUnticked: locks are left as they are."
Hotkey.Modes.On="StageKit: %1: switch to %2"
Hotkey.Modes.Next="StageKit: %1: next mode"
Hotkey.Modes.None="StageKit: %1: no mode"
