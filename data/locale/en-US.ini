; ==== scene-filters:transitions ====
Change.Scene="As the scene sets"
Change.Scene.Tip="As the scene sets: the transition this scene's Scene Transitions filter gives the source; where the scene has none, a fade of this length."
Change.Time.Tip="How long the transition takes. With As the scene sets, used only where the scene has no Scene Transitions filter."
SceneTrans.Name="Scene Filter: Scene Transitions (StageKit)"
SceneTrans.NotScene="This filter is not on a scene, where it does nothing. Add Scene Transitions to a scene instead (right-click the scene, Filters)."
SceneTrans.Second="Another Scene Transitions comes first on this scene, and that one is used. This one does nothing while it is there."
SceneTrans.Cover="Sources covered"
SceneTrans.Cover.All="All sources"
SceneTrans.Cover.Listed="Chosen sources"
SceneTrans.Cover.Tip="Which sources in this scene get the show and hide transitions set below.\nAll sources: every source in the scene, a group counting as one (see Sources in groups), sources added later too, except Ignored sources.\nChosen sources: only the sources listed below.\nThey are OBS's own transitions on each source (the ones in its right-click menu), so they also hold when a source is shown or hidden with the eye, its hotkeys, a Stream Deck key or obs-websocket, and in every StageKit filter set to As the scene sets. Switching this filter off or removing it leaves each source the transitions it has."
SceneTrans.Sources="Sources with own settings"
SceneTrans.Sources.Tip="Add a source here to give it a transition of its own: choose it under Settings for. Every other source uses the scene's transition."
SceneTrans.Chosen="Chosen sources"
SceneTrans.Chosen.Tip="Only these sources get the scene's transition. To give one a transition of its own, choose it under Settings for."
SceneTrans.AddSource="Add a source"
SceneTrans.Except="Ignored sources"
SceneTrans.Except.Tip="Sources whose transitions this filter never sets, such as one another tool animates. A StageKit filter set to As the scene sets uses a fade for them."
SceneTrans.InGroups="Sources in groups"
SceneTrans.InGroups.Tip="Also set the sources inside groups. OBS plays an inner source's transitions whenever its group is shown or hidden as well, so a fade on both fades twice. Off: a group is one source like any other."
SceneTrans.Override="Override other filters"
SceneTrans.Override.Tip="Every show and hide of a source this filter covers uses this scene's transition (or the source's own, under Settings for), whatever Link Visibility, Show in Scenes, Scene Modes, Program Trigger or a window switcher is set to. Off: a filter set to a transition of its own uses it for its change, and the scene's is put back after; set those filters to As the scene sets to use the scene's. A source a Standby Image stands in for keeps the Standby's transition."
; ==== end scene-filters:transitions ====
; ==== scene-filters:fit ====
SceneFit.Name="Scene Filter: Scene Fit (StageKit)"
SceneFit.OnGroup="This filter is on a group, where it does nothing: a group is only as large as what is in it. Add Scene Fit to the scene instead (right-click the scene, Filters) and list the group as a fitted source."
SceneFit.Which="Sources covered"
SceneFit.Which.All="All sources"
SceneFit.Which.Listed="Chosen sources"
SceneFit.Which.Tip="All sources: every source in the scene is fitted, a group counting as one, sources added later too. The ones under Fitted sources come first, in their order, then the rest from the top of the scene down, each starting from the usual settings (change them under Settings for). Left out: sources under Never fitted, a source a Fit to Space of its own already fits, and a source that covers 90% of the screen or more when it is first met, such as the background.\nChosen sources: only the sources under Fitted sources."
SceneFit.Skip="Never fitted"
SceneFit.Skip.Tip="With All sources, sources in this scene that are never fitted. They stay where they are, and the fitted sources still keep clear of them."
SceneFit.Entries="Fitted sources"
SceneFit.Entries.Tip="The sources this filter fits, each in the free space round its place, with settings of its own (choose it under Settings for). They are worked out together, top first: put sources that keep their size, such as a camera or a chat box, above the ones that are resized. Do not also give a listed source a Fit to Space of its own."
SceneFit.AddSource="Add a source"
SceneFit.TakeOver="Take over Fit to Space"
SceneFit.SkipFillOn.Tip="One switch for every fitted source: whether a source's ignored sources count after all when its image would leave too much of its space empty. Each source's own rules (Use fill percentage, Use edge gaps) are in that source's settings, under Settings for. They show there with Fit area on Free space around source, and with The whole screen or A box I set once Make room if not filling is ticked for that source. A Fit to Space Overlap key on the Stream Deck sets this switch."

SceneFit.TakeOver.Tip="Every Fit to Space switched on in this scene becomes a fitted source here, with all its settings, the place it keeps its source round and the size it keeps, and is switched off (not deleted: switch it on again to go back). Nothing moves. Taken into a Scene Fit with no sources yet, two or more that all have the same settings make Settings are: Shared by all sources. With the settings already shared, the sources taken over go by those settings (their own are kept for Each source's own)."
SceneFit.For="Settings for"
SceneFit.For.Tip="Which fitted source's settings are shown below. Each has its own."
SceneFit.EntryOn="Fit this source"
SceneFit.EntryOn.Tip="Unticked, this source is not fitted: it is left where it is and takes no room from the others. The dock's Auto-fit with Selected only switches this."
SceneFit.SkipFor="Ignored for this source"
SceneFit.ShareFor="Sync position to scenes"
SceneFit.ListPriority.Tip="Ticked, each source's Space priority is not used: a source higher in this list takes its space first and the ones below fit around it. With All sources, the sources not in the list come after them, from the top of the scene down. The Scene Fit counts at its place in the scene's filter list against any Fit to Space there that also has Priority by list order ticked; towards the others it counts as Shares space."
SceneFit.Settings="Settings are"
SceneFit.Settings.Each="Each source's own"
SceneFit.Settings.Same="Shared by all sources"
SceneFit.Settings.Tip="Each source's own: every fitted source has its own settings, chosen under Settings for.\nShared by all sources: one set of settings, Space priority included, for every fitted source, so this filter fits them as a group. To give groups of sources different settings, add one Scene Fit per group to the scene, for example one for the game and window captures set to Takes space first, and one for the camera and chat box set to Makes room. Each source still keeps its own place and its own kept size. Switching either way moves nothing: the shared settings start as the first source's, and going back gives every source the shared settings."
SceneFit.Settings.Group="Shared settings"
; ==== end scene-filters:fit ====
; ==== scene-filters:standby-corners ====
SceneStandby.Name="Scene Filter: Scene Standby (StageKit)"
SceneStandby.FilterName="Standby Image (Scene Standby)"
SceneStandby.OnGroup="This filter is on a group, where it does nothing. Add Scene Standby to the scene instead (right-click the scene, Filters)."
SceneStandby.Status.None="No source is covered yet."
SceneStandby.Status.Covers="Covers: %1."
SceneStandby.Status.Own="Uses its own filter: %1."
SceneStandby.Status.Grouped="Not shown when hidden (in a group): %1."
SceneStandby.Status.Tip="Each source covered has a Standby Image filter that says it is set by Scene Standby. A source that already had a Standby Image filter of its own keeps it, and is left alone."
SceneStandby.Which="Sources covered"
SceneStandby.Which.Every="All sources"
SceneStandby.Which.All="Every capture"
SceneStandby.Which.Chosen="Chosen sources"
SceneStandby.Which.Tip="All sources: every source in this scene, the ones inside groups too, and sources added later, except Ignored sources. A source with no image (an empty capture, a stopped video, a text with no words) shows the standby image. Groups, nested scenes and the source used as the image are left out.\nEvery capture: each game, window and camera capture in this scene, groups included (screen captures only with Include screen captures).\nChosen sources: only the sources listed."
SceneStandby.Sources="Chosen sources"
SceneStandby.Sources.Tip="The sources that show the standby image when they have no image."
SceneStandby.Skip="Ignored sources"
SceneStandby.Skip.Tip="Sources in this scene that get no standby image."
SceneStandby.Screens="Include screen captures"
SceneStandby.Screens.Tip="Screen captures always have an image, so they are left out as it comes. Ticked, they are covered too."
SceneStandby.WhenEmpty="Show when no image"
SceneStandby.WhenEmpty.Tip="Ticked: a covered source with no image (no game or window attached, no camera signal) shows the standby image in its place, in every scene it is in. Unticked: the filters stay on the sources but show nothing then; Show when hidden still works."
SceneStandby.Hidden="Show when hidden"
SceneStandby.Hidden.Tip="Sources whose place the standby image takes in this scene while they are hidden: the same position and size, with their shadow and corners. Only in this scene. Leave out captures that are hidden on purpose (the stacked captures of a layout scene). The Show/Hide transition below is the change between the source and the image."
SceneStandby.Help="One place to set the standby image for the sources of this scene. Each covered source gets a Standby Image filter, set from here and marked as set by Scene Standby. The image for an empty capture goes with the source into every scene it is in; Show when hidden is for this scene only. A Standby Image filter you made yourself is left as it is. Switch a source's filter off with its eye to go without the image there: it stays off."
Standby.Status.Managed="Set by Scene Standby in %1."
Standby.Status.Managed.Tip="This filter's image and transitions are set in the Scene Standby filter on that scene (right-click the scene, Filters)."
Standby.Status.Orphan="No Scene Standby uses this filter any more; it shows nothing and can be removed."
SceneCorners.Name="Scene Filter: Scene Corners (StageKit)"
SceneCorners.FilterName="Corners & Edges (Scene Corners)"
SceneCorners.OnGroup="This filter is on a group, where it does nothing. Add Scene Corners to the scene instead (right-click the scene, Filters)."
SceneCorners.Status.None="No source is covered yet."
SceneCorners.Status.Covers="Covers: %1."
SceneCorners.Status.Own="Uses its own filter: %1."
SceneCorners.Which="Sources covered"
SceneCorners.Which.Every="All sources"
SceneCorners.Which.All="All but the background"
SceneCorners.Which.Chosen="Chosen sources"
SceneCorners.Which.Tip="All sources: every source in this scene (a group counts as one), sources added later too, except Ignored sources. A background gets the corners as well.\nAll but the background: the same, also leaving out the background (what covers 90% of the screen or more, under the rest), with Full-screen = background.\nChosen sources: only the sources listed."
SceneCorners.Sources="Chosen sources"
SceneCorners.Sources.Tip="The sources that get these corners and edges."
SceneCorners.Skip="Ignored sources"
SceneCorners.Skip.Tip="Sources in this scene that get no corners or edges."
SceneCorners.AutoBackground="Full-screen = background"
SceneCorners.AutoBackground.Tip="Ticked: sources at the bottom of the scene that cover 90% of the screen or more are taken for the background and left as they are."
SceneCorners.Area="Corners on"
SceneCorners.Area.Each="Each source"
SceneCorners.Area.Whole="The whole scene"
SceneCorners.Area.Tip="Each source: every covered source gets a Corners & Edges filter with this look.\nThe whole scene: the scene's image itself gets this look at the edges of the screen, as one shape (rounded or cut corners, softened edges, a border). Its sources get no filter, and any it had added are taken off. Sizes are screen pixels."
SceneCorners.Status.Whole="Shapes the whole scene: no source gets a filter."
SceneCorners.Help="Corners and edges for the sources of this scene, set once. Each covered source gets a Corners & Edges filter, set from here and marked as set by Scene Corners. It never changes a source's size, so nothing moves. Switching this filter off switches them off. A Corners & Edges you made yourself is left as it is."
Corners.Status.Managed="Set by Scene Corners in %1."
Corners.Status.Orphan="No Scene Corners sets this any more: it works as one of your own."
; ==== end scene-filters:standby-corners ====
; ==== scene-filters:shadow ====
SceneShadow.Name="Scene Filter: Scene Shadow (StageKit)"
SceneShadow.OnGroup="This filter is on a group, where it does nothing. Add Scene Shadow to the scene instead (right-click the scene, Filters)."
SceneShadow.Outline.Tip="A line round the sources that cast the shadow, kept off every source that is not background."
SceneShadow.AddSource="Add a source"
SceneShadow.Background="Background sources"
SceneShadow.Background.Tip="Drawn underneath as they are: they cast no shadow, and the shadow falls on them."
SceneShadow.AutoBackground="Full-screen = background"
SceneShadow.AutoBackground.Tip="Sources at the bottom of the scene that cover 90% of the screen or more count as background."
SceneShadow.Which="Sources covered"
SceneShadow.Which.All="All sources"
SceneShadow.Which.Chosen="Chosen sources"
SceneShadow.Which.Tip="All sources: every source in this scene that is not background casts the shadow, sources added later too, except Ignored sources. A group counts as one source.\nChosen sources: only the sources listed cast it. With Shadow from: The scene as drawn the shadow is still kept off every source that is not background."
SceneShadow.From="Shadow from"
SceneShadow.From.Scene="The scene as drawn"
SceneShadow.From.Each="Each source by itself"
SceneShadow.From.Tip="The scene as drawn: sources that overlap make one shape with one shadow and one outline round it, and a shadow never falls on another source.\nEach source by itself: every source gets its own shadow, glow and outline, as a Shadow, Glow & Outline filter on each source would give it. A source's shadow falls on whatever lies under it, other sources too, and the sources above it cover it."
SceneShadow.Sources="Chosen sources"
SceneShadow.Sources.Tip="The sources that cast the shadow or outline."
SceneShadow.Skip="Ignored sources"
SceneShadow.Skip.Tip="These sources cast no shadow or outline. A source with a Shadow, Glow & Outline filter of its own keeps that one and casts nothing here. With Shadow from: The scene as drawn the shadow is kept off them; with Each source by itself the shadow of a source above them falls on them."
SceneShadow.Ramp="Switch duration"
SceneShadow.Ramp.Tip="How long the shadow takes to fade in or out when the filter is switched on or off (the eye, a hotkey or a Stream Deck key)."
; ==== end scene-filters:shadow ====
; ==== scene-filters:blur ====
SceneBlur.Name="Scene Filter: Scene Blur (StageKit)"
SceneBlur.OnGroup="This filter is on a group, where it does nothing. Add Scene Blur to the scene instead (right-click the scene, Filters)."
SceneBlur.Cover="Sources covered"
SceneBlur.Cover.All="All sources"
SceneBlur.Cover.Live="Live and capture sources"
SceneBlur.Cover.Chosen="Chosen sources"
SceneBlur.Cover.Tip="Which of this scene's sources are blurred, in this scene only: the same source in another scene stays sharp. Live and capture sources are game, window, display and camera captures, capture cards and media (the Blur filter's 'And live captures on screen', and media besides), also by way of a Cropped View, a group or a nested scene. A group or a nested scene is blurred or left sharp as one source. A source above a blurred one that is not blurred stays sharp."
SceneBlur.Chosen="Chosen sources"
SceneBlur.Chosen.Tip="The sources blurred with 'Chosen sources'. A group or nested scene is blurred as one source."
SceneBlur.Never="Never blur these"
SceneBlur.Never.Tip="Sources that stay sharp whatever is chosen above: your camera, say. A Cropped View of a listed source stays sharp too, and a live capture listed here does not make the group or nested scene it is in count as live."
SceneBlur.AddSource="Add a source"
SceneBlur.ToggleNow="Blur on / off now"
SceneBlur.Area="Blur area"
SceneBlur.Area.Scene="The scene as drawn"
SceneBlur.Area.Each="Each source by itself"
SceneBlur.Area.Tip="The scene as drawn: the finished scene is blurred and the blur is kept to where the chosen sources show, so a blurred source's edge takes in what is around it, and a mosaic's cells are laid out over the whole screen. Each source by itself: every chosen source is blurred from its own image only, as a Blur filter on that source would blur it (its edges take in nothing around it, and a mosaic is laid out over that source), and is drawn in its place. With a Scene Shadow on the scene, the shadow of such a source follows the blurred image's shape, whole cells included. It draws the scene's sources again, so it costs more with many sources."
Hotkey.SceneBlurToggle="StageKit: %1: toggle"
Hotkey.SceneBlurOn="StageKit: %1: switch on"
Hotkey.SceneBlurOff="StageKit: %1: switch off"
; ==== end scene-filters:blur ====
