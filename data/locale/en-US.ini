Trigger.Opposite.Tip="Hide the items and switch the filters off while the program is here, and show and switch them on when it has gone."
Trigger.Help="Add this to a scene to show and hide its items, or to any source to switch that source's filters. While the program is here the items are shown and the filters are on; when it goes they are hidden and off. It acts when the program appears or goes, so anything you change by hand in between is left alone until then. Windows only. A minimised window does not count."

