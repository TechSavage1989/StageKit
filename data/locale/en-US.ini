Corners.Which.Tip="The corners that are shaped. The others stay square."
Corners.Border.Tip="A line drawn inside the image's edge, following the corners. 0: none. For a line outside the edge, use Shadow, Glow & Outline's Outline."
Corners.BorderLook.Tip="The border's colour, and how strongly it shows."
Corners.ScreenPx="Sizes in screen pixels"
Corners.ScreenPx.Tip="Ticked: sizes are in pixels of the finished scene, so a 40 px corner looks the same on a large source and a small one. Unticked: sizes are in the source's own pixels and shrink or grow with it."

Fit.Name="Scene Filter: Fit to Space (StageKit)"
Fit.Help="On a scene, one filter per source. While it is on, the source is kept fitted in its area or in the free space around it."
Fit.Item="Source"
Fit.Item.None="(choose a source)"
Fit.Box="Fit area"
Fit.Box.Scene="The whole screen"
Fit.Box.Custom="A box I set"
Fit.BoxX="Box left"
Fit.BoxY="Box top"
Fit.BoxWidth="Box width"
Fit.BoxHeight="Box height"
Fit.Box.Free="Free space around source"
Fit.Box.Tip="The whole screen: an image of the screen's shape fills it; any other shape floats in the middle with the margin. A box I set: the same, in a box you give. Free space around source: the source grows as large as it can where it is, keeping the gap below from the screen's edges and from every other source. Drag the source to another part of the scene and it takes the free space there."
Fit.Gap="Gap"
Fit.Visible.Tip="Ticked: the fitted source and the sources around it are measured by what they draw, and a source that draws nothing is not in the way. It counts for the fitted source in every Fit area.\nUnticked: they go by their boxes.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.NoShadows.Tip="Ticked: shadows, glows and outlines do not count, neither the source's own nor the other sources'. The gap is kept from the images.\nUnticked: the effects keep the gap too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.Glide="Move duration"
Fit.Glide.Tip="How long the source takes to glide to a new size and place when the free space changes, for example when another source is moved, shown or hidden. 0 changes at once."
Fit.Skip="Ignored sources"
Fit.Skip.Tip="Sources the free space ignores, such as a camera that is meant to overlap the game. Backgrounds and frames need not be listed: anything the source's place lies inside is not in the way."
Fit.OnGroup="This filter is on a group, where it does nothing: a group is only as large as what is in it. Add Fit to Space to the scene instead (right-click the scene, Filters) and choose the group as its source."
Fit.Group.Move="5. Movement"
Fit.Group.Measure="4. Measuring"
Fit.Group.Share="3. Sharing the space"
Fit.Group.Size="2. Size"
Fit.Group.Where="1. Where"
Fit.Resize="Resize to fit"
Fit.Resize.Tip="Ticked: the source is made as large as its space allows, keeping its shape.\nUnticked: the source keeps the size it has on the screen and is only moved, to where Align in the space puts it in its space. If the filter had already resized it, unticking gives it back the size it had before. Resize it yourself in the preview and that becomes the size it keeps.\nTicked, a source you resize by hand glides back to fill its space a moment after you let go."
Fit.Priority="Space priority"
Fit.Priority.Shares="Shares space"
Fit.Priority.First="Takes space first"
Fit.Priority.MakesRoom="Makes room"
Fit.Priority.Tip="Which of the scene's fitted sources gets its space when two want the same room (only in the free space). Takes space first: this source takes the space it would have if those that share space or make room were not there, and never moves or shrinks for a source that shares space or makes room; those fit around it. Shares space: as it always was, each source goes by where the others are going and they make room for each other. Makes room: this source always fits around every source that shares space or takes space first. Two sources with the same setting share. A source set to Priority by list order counts as sharing space towards one that is not."
Fit.ListPriority="Priority by list order"
Fit.ListPriority.Tip="Ticked, Space priority is not used: among the fitted sources of this scene that have this ticked, one higher in the scene's filter list takes its space first and the ones below fit around it. Move a filter up or down and the sources glide to their new places. A Scene Fit counts at its place in the list, its sources in its own order. Towards a fitted source without this ticked it counts as Shares space."
Fit.Toward="Align in the space"
Fit.Toward.Tip="Where the source lies in its space when it does not fill it: an image of another shape than the space, or a source that keeps its size. Always obeyed, whatever lies beside it, for every source and every layout. The middle: the room left over is the same on both sides. A side or a corner: it lies against that side, the gap away, and the room left over is all on the other side. Listed row by row as the nine squares of OBS's own bounding box alignment.\nAlso in a layout made by hand with the filter off: switching the filter on moves a source to where this puts it."
Fit.Toward.Middle="• The middle"
Fit.Toward.Top="↑ The top"
Fit.Toward.Bottom="↓ The bottom"
Fit.Toward.Left="← The left"
Fit.Toward.Right="→ The right"
Fit.Toward.TopLeft="↖ The top left"
Fit.Toward.TopRight="↗ The top right"
Fit.Toward.BottomLeft="↙ The bottom left"
Fit.Toward.BottomRight="↘ The bottom right"
Fit.Share="Sync position to scenes"
Fit.Share.Tip="Each time this filter has put its source in place while its scene is on screen, the same source in the scenes listed here is given exactly that place and size, so it is already there when you switch to one of them. Scenes not listed are never touched: the source keeps its own place there. A listed scene that is on screen at that moment is left alone, so nothing jumps in view. Locked copies are moved too. The link holds both ways: a listed scene with a Fit to Space of its own for the source gives its place back to this scene when it is the one on screen."
Fit.SkipFillOn="Overlap only when it fills"
Fit.SkipFillOn.Tip="For the ignored sources, such as a camera. Unticked: the fitted source always goes under them. Ticked: it goes under them only while it would fill its space; a source that would leave empty room (a narrow window on a wide screen) is fitted beside them instead, like beside any other source. With The whole screen or A box I set and Make room if not filling: ticked, the source leaves the whole screen for the room beside the other sources while it does not fill; unticked, it always takes the whole screen. A Stream Deck key, Fit to Space Overlap, switches this."
Fit.MakeRoom="Make room if not filling"
Fit.MakeRoom.Tip="For The whole screen or A box I set. An image that fills the screen is fitted there as ever, over the other sources. One that does not fill it (a 4:3 standby image on a widescreen canvas) is fitted into the largest space clear of the other sources instead, keeping the margin as a gap, so it sits beside a camera rather than over a sliver of it. Needs Overlap only when it fills ticked below; the two rules under it say what counts as filling. Unticked, those are hidden: the source takes its whole area whatever lies on it."
SceneFit.MakeRoom.Tip="For The whole screen or A box I set. An image that fills the screen is fitted there as ever, over the other sources. One that does not fill it (a 4:3 standby image on a widescreen canvas) is fitted into the largest space clear of the other sources instead, keeping the margin as a gap, so it sits beside a camera rather than over a sliver of it. Needs the Scene Fit's own Overlap only when it fills ticked, above the sources' settings; the two rules below say what counts as filling. Unticked, those rules are hidden: the source takes its whole area whatever lies on it."
Fit.RoomOnlyHit="Only if it would overlap"
Fit.RoomOnlyHit.Tip="For Make room if not filling. Ticked, room is made only when the image, fitted to the screen as it would be without making room, would actually overlap one of the Make room for sources. A camera that lies wholly in the empty bar beside a narrow image is then left alone and the image keeps the whole screen. Measured by what shows of each, as Use visible pixels and Ignore shadows & outlines say; touching edges and the gap do not count, and a source that draws nothing is not there."
Fit.RoomFor="Make room for"
Fit.RoomFor.Tip="The sources room is made for while the image does not fill the screen. With none listed, room is made for every other source. Backgrounds and frames need not be left out: anything the middle of the screen lies inside is not in the way. While the image fills the screen it lies over all of them."
Fit.RoomUsePct.Tip="The image fills the screen when it would cover at least the percentage below of it (of the screen less the margin, for an image of another shape). If Use edge gaps is ticked too, meeting either one is enough. With neither ticked, it never counts as filling and always makes room."
Fit.RoomFill.Tip="How much of the screen the image must cover to take the whole screen, over the other sources. At 95%, a widescreen game takes a widescreen canvas, and a 4:3 image, which would cover about three quarters, is fitted beside the camera instead."
Fit.RoomUsePx.Tip="The image fills the screen when it reaches close enough to all four edges of it (of the screen less the margin, for an image of another shape). Each slider is the widest gap allowed at that edge. If Use fill percentage is ticked too, meeting either one is enough."
Fit.RoomPx.Tip="The widest empty gap allowed between the image and this edge for it to count as filling the screen. 0 means it must reach this edge. All four edges must be within their gaps; if one gap is wider, the image makes room for the other sources instead. In canvas pixels."

Fit.SkipUsePct="Use fill percentage"
Fit.SkipUsePct.Tip="Overlap the ignored sources (the camera) when the fitted source would cover at least the percentage below of its space. If Use edge gaps is ticked too, meeting either one is enough. With neither ticked, the fitted source always goes beside the ignored sources."
Fit.SkipUsePx="Use edge gaps (pixels)"
Fit.SkipUsePx.Tip="Overlap the ignored sources (the camera) when the fitted source reaches close enough to all four edges of its space. Each slider is the widest gap allowed at that edge. Example: a window that fills the width and leaves 20 px above and below overlaps the camera with top and bottom at 30; a narrower window that leaves 300 px at the sides goes beside the camera unless left and right are 300 or more. If Use fill percentage is ticked too, meeting either one is enough."
Fit.SkipPxTop="Top gap up to"
Fit.SkipPxBottom="Bottom gap up to"
Fit.SkipPxLeft="Left gap up to"
Fit.SkipPxRight="Right gap up to"
Fit.SkipPx.Tip="The widest empty gap allowed between the fitted source and this edge of its space for it to overlap the ignored sources. 0 means it must reach this edge. All four edges must be within their gaps; if one gap is wider, the source is fitted beside the ignored sources instead. In canvas pixels."
Fit.SkipFill="Fill needed to overlap"
Fit.SkipFill.Tip="How much of its space the fitted source must fill to go under the ignored sources. At 98%, a window that fills the screen stays under the camera, and one that would fill less is fitted beside the camera."
Fit.Tolerance="Size tolerance"
Fit.Tolerance.Tip="For the free space. When something sticks a little way into the space, the image can either be made that much smaller and keep the whole space, or keep its size and lose the part of the space beside that thing. Up to this many pixels smaller, it keeps the whole space. 0: the biggest image always wins, even by one pixel. The gap is kept either way."
Fit.Margin="Margin for other shapes"
Fit.Margin.Tip="For the whole screen or a box: an image with the box's own shape fills the box; any other shape, such as an emulator's squarer image on a widescreen canvas, is kept this far from the box's edges and centred. For the free space: the source is always kept exactly this far from the screen's edges and from the other sources, at its nearest."

