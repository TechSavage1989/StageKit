Frame.Name="Source Filter: Auto Frame (StageKit)"
Frame.Mode="Frame"
Frame.Mode.Fixed="A fixed size"
Frame.Mode.Picture="Just the image"
Frame.Mode.Tip="A fixed size: the source always has the size below and the image is fitted inside it. Just the image: the source is the trimmed game image and nothing else, always at the height below and as wide as its aspect ratio needs, so a game changing resolution does not change its size. Each scene can then place it its own way, for example with a Fit to Space filter."
