Standby.OwnShape.Tip="Ticked: while the source has no image, the standby image is shown whole, in its own aspect ratio, as tall as the source last was. Unticked: it fills the size the source last had, with what does not fit cut off."
Standby.Style="No-signal transition"
Standby.Style.Fade="Fade"
Standby.Style.Cut="Cut"
Standby.Style.SlideLeft="Slide left"
Standby.Style.SlideRight="Slide right"
Standby.Style.SlideUp="Slide up"
Standby.Style.SlideDown="Slide down"
