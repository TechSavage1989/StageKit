Arrange.SameEverywhere="Copy transform to all scenes"
Arrange.SameEverywhere.Tip="Takes the selected item's position, size, rotation and crop in this scene and gives them to every copy of the same source in all your other scenes (or to the sources listed under 'Sources to copy to', if any). It is OBS's Copy Transform and Paste Transform done for every scene at once. With several items selected, each does this for its own source. Copies inside groups land on the same spot of the screen. Locked copies are left alone. One step in Edit > Undo."
