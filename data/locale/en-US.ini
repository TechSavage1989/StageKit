Frame.Status.NoProgram="No program detected on this source yet."
Frame.Status.Program="Capturing %1."
Frame.Status.Auto="Aspect ratio: worked out from the image."
Frame.Status.BuiltIn="Aspect ratio: %1, usual for this program. It is corrected if the image shows otherwise."
Frame.Status.Found="Aspect ratio: %1, worked out from the image."
Frame.Status.SeenBefore="Aspect ratio: %1, as this program showed before. It is corrected if the image shows otherwise."
Frame.Status.Yours="Aspect ratio: %1, from your saved aspect ratios."
Frame.Status.Key="Aspect ratio: %1, set by an Aspect Ratio Preset."
Frame.Status.Trim="Aspect ratio: %1, from the current trim."
Frame.Known="Start from usual ratios"
Frame.Known.Tip="A program starts from the aspect ratio its image had the last time it was captured, or from the usual one of a common emulator, so the image is right from the first frame. What is then seen on screen corrects it."
Frame.Forget="Forget ratios seen before"
Frame.Forget.Tip="Clears the aspect ratios remembered for programs from earlier sessions. Ones you saved yourself are kept. Remembered now:"
Frame.Forget.None="none."
Frame.RuleProgram="Program or window"
Frame.RuleProgram.Tip="Filled from the captured window's title, or its program when no title is available. You can edit it to match part of a title or file name. Manual edits stay until Remember this ratio or a new measurement. When several saved ratios match, the longest name is used."
Frame.RuleBrowse="Find its file"
Frame.RuleShape="Its aspect ratio"
Frame.RuleAdd="Remember this ratio"
Frame.Rules.Tip="The aspect ratios saved for programs, one row each; press a row's ✕ to take it off. A name can be a program's file or part of a window's title, and the longest name that fits wins. Read only while the trim is Automatic."
Frame.Width.Tip="The width the source always has, in pixels. The image is fitted inside it."
Frame.Height.Tip="The height the source always has, in pixels. With Just the image, the width follows the image's aspect ratio."
Frame.Copy.Tip="Takes the frame's size from a source already laid out: choose its scene and the source, then press Use that source's size."
Frame.Fit.Tip="How the image is fitted in the frame: whole and as large as it fits, at a whole-number scale (sharpest for pixel art), filling the frame with its edges cut off, or stretched to it."
Frame.Custom.Tip="The display shape as two numbers, width to height: 4 and 3 is 4:3."
Frame.Align.Tip="Where the image lies in the frame when its shape leaves room at the sides or at the top and bottom."
Frame.Sharp.Tip="Ticked: the image is scaled without smoothing, so pixel art keeps hard edges. Unticked: it is scaled smoothly."
Frame.Trim.Tip="What is done with black bars round the game's image.\nTrim automatically: they are found and cut off by themselves.\nTrim a set amount: the amounts below are cut off.\nLeave them: nothing is cut off."
Frame.TrimNow.Tip="Measures and trims the current captured image without waiting for Keep aspect ratio for. Shows its detected ratio and fills the program/window and ratio fields. No program rule is saved until Remember this ratio or Keep this trim for this program is pressed."
Frame.TrimXY.Tip="How much is cut off each side, in the capture's own pixels."
Frame.RuleBrowse.Tip="Picks a program's file on the computer to fill in Program or window."
Frame.RuleShape.Tip="Filled from the detected image ratio, including custom ratios. Choose one or type your own, such as 4:3. Editing either field keeps your draft until Remember this ratio or a new measurement."
Frame.RuleAdd.Tip="Saves the aspect ratio for the program or window above and returns to automatic trimming. It is used whenever that program or window is captured."
Frame.Glide.Tip="How long the image takes to glide to its new size and place after a change."
Frame.Help="First on a game, window or capture-card source. While it is on, the source keeps one size and the image is fitted inside it."

