Modes.Help="On a scene. While it is on, the sources of the mode that is on are shown and those of the other modes are hidden."
Modes.Now="Mode now"
Modes.Now.Tip="The mode that is on. Choosing another here turns it on now, as a key would, but never changes scene."
Modes.None="(no mode)"
Modes.NewName="New mode name"
Modes.NewName.Tip="Type a name, then press 'Add mode'. Any name will do, for example Game, Chat or Intermission. Two modes may have the same name."
Modes.Add="Add mode"
Modes.Add.Tip="Adds a mode with the name typed above, or the template's name when none is typed. A template also gives it its type. Its keys and hotkey follow it when it is renamed."
Modes.Template="From template"
Modes.Template.Tip="A template gives a new mode a name and a type to start from. Both can be changed afterwards."
