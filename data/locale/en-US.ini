StartImage.Name="Standby Image (StageKit)"
StartImage.File="Standby image"
StartImage.Help="Shows the standby image. Choose it here or in the StageKit dock: it is one image for the whole scene collection, and any Ambient Background set to 'The standby image' follows it."

Capture.Name="Source Filter: Auto Capture (StageKit)"
Capture.Status.Now="Now capturing: %1"
Capture.Status.Waiting="Aimed at %1, which shows no image yet. A game running in it is captured as soon as it draws."
Capture.Status.None="Waiting for a game. Start one and bring it to the front; there is nothing to set up."
Capture.NeverNow="Never capture this program"
Capture.Check="Check again"
Capture.Lists="Your lists"
Capture.Never="Never capture"
Capture.Never.Tip="Programs to leave alone. Part of the file name or of the window's title is enough, for example: blender."
Capture.Always="Always capture"
Capture.Always.Tip="Optional. Games it does not find by itself. Part of the file name or of the window's title is enough."
Capture.Mode="Find games"
Capture.Mode.AnyGame="Automatically"
Capture.Mode.ListedOnly="Only from 'Always capture'"
Capture.Fallback="No game: capture any full-screen app"
Capture.KeepReady="Keep capturing in other scenes"
Capture.NoGameStandby="No game: Standby Image"
Capture.NoGameStandby.Tip="Needs a Standby Image filter on this capture. Ticked: while no game is captured, the Standby Image is shown over the capture (also over a full-screen app it falls back to), with the transition set below. When a game is found, the Standby Image gives way to it."
Capture.HideStandby.Tip="Ticked, with a Standby Image filter on this capture: hiding the capture (the hotkey, the button, or the Stream Deck Manual Window / Source key set to Hide) brings the Standby Image in over it, and showing it takes the image away. Nothing around it moves. Without a Standby Image, or unticked, the capture is hidden in every scene it shows in, and the next press shows it again only there.\nThe Standby Image's own Show when source is hidden is another thing: it stands in whenever anything hides the source in a scene."
Capture.StandbyStyle.Tip="How the Standby Image comes in and goes again when this filter shows it: for no game, and for hiding. The Standby Image filter's own transition is used when the capture simply has nothing."
Standby.Name.Short="Standby Image"
Standby.WhenHidden="Show when source is hidden"
Standby.WhenHidden.Tip="While this source is hidden in a scene, the standby image is shown in its place there: the same position and size, with this source's shadow, corners and the other filters after this one. StageKit puts a locked stand-in under each copy of the source and shows and hides it by itself. The Show/Hide transition below is the change between the source and the standby image, whatever hides the source. With Morph the one changes into the other."
Standby.StandIn="Standby stand-in (StageKit)"
Standby.StandIn.Suffix="(standby)"
Capture.KeepReady.Tip="Ticked: the capture carries on while you are on a scene that does not show it, so it is there at once when you come back.\nUnticked: OBS stops it a moment after you leave and starts it again when you return, which can cost a few frames at each scene switch."

AppCapture.Name="Source Filter: Automatic Window Switcher (StageKit)"
AppCapture.Status.None="The capture is not aimed at a window yet."
AppCapture.Status.Held="Capturing: %1, a manual window. It stays until you return to automatic."
AppCapture.ByHand="Manual windows"
AppCapture.ByHand.Tip="Other windows this capture can show when you say so, such as your browser. Switch to next manual window takes the next of them that is open and holds it, whatever window is active; after the last, or with Return to automatic, the windows above are followed again. The capture has five hotkeys in Settings → Hotkeys: next manual window, return to automatic, toggle manual / automatic, hide or show the capture, and clear picked windows. The Stream Deck Manual Window / Source key does the same."
AppCapture.ByHand.Toggle="Toggle manual / automatic"
AppCapture.ByHand.Next="Switch to next manual window"
AppCapture.ByHand.Back="Return to automatic"
AppCapture.ByHand.Clear="Clear picked windows"
AppCapture.ByHand.Clear.Tip="Takes the windows you picked with Capture Active Window off both lists, Windows to switch between and Manual windows. Programs and titles you added yourself stay. If a picked window is being shown, the capture goes on to the next automatic window, or shows the Standby Image if none is open. Also a hotkey under the capture, and the Stream Deck Manual Window / Source key set to Clear picked windows."
AppCapture.ClearPicked="Clear picked windows on exit"
AppCapture.ClearPicked.Tip="Ticked: windows picked with Capture Active Window are only kept for this OBS session, and are gone the next time OBS starts (or this scene collection is loaded again). Unticked, they stay on the list, and are found again by their program and exact title."
AppCapture.Picked="Captured window"
AppCapture.Picked.Wait="Wait until switched to"
AppCapture.Picked.Now="Switch at selection"
AppCapture.Picked.Tip="For a window picked with the Stream Deck Capture Active Window key. Wait until switched to: it becomes the manual window and is captured in the background, while the capture goes on showing your automatic windows; it is shown when you switch to it (Manual Window / Source: Toggle or Next). Switch at selection: the capture changes to it straight away."
AppCapture.HandFollow="Auto-switch manual windows"
AppCapture.HandFollow.Tip="While a manual window is shown, the capture follows among your Manual windows the way it follows among the Windows to switch between: it changes to the manual window you click into or that opens, and back to the one before when the one shown closes. Windows that are not on the Manual windows list are never taken. Unticked, the manual window shown stays until you switch."
AppCapture.Ready="Keep other windows captured"
AppCapture.Ready.Tip="While this capture is showing, the other open apps on the two lists are captured in the background, so the one you switch to is there at once and the change is between two live images. Untick to save graphics memory; a switch then waits for the capture to find the other window."
AppCapture.GameArea="Game area only"
AppCapture.GameArea.Tip="Shows only the part of the window the app draws its game in: an emulator's menu bar, tool bar and status bar are left out, found by itself for each window and followed when it changes. Needs Window Capture's Client area ticked. Where no such part is found the window is shown whole, and OBS's log says what was found."
AppCapture.Change.Morph="Morph"
AppCapture.Hide="Show/Hide transition"
AppCapture.Hide.Now="Hide/show capture now"
AppCapture.HideStandby="Hide shows Standby Image"
AppCapture.HideStandby.Tip="Ticked, with a Standby Image filter on this capture: hiding the capture (the hotkey, the button, or the Stream Deck Manual Window / Source key set to Hide) brings the Standby Image in over it, the way that filter is set to change, and showing it takes the image away. Nothing around it moves. Without a Standby Image, or unticked, the capture is hidden in every scene it shows in, and the next press shows it again only there.\nThe Standby Image's own Show when source is hidden is another thing: it stands in whenever anything hides the source in a scene."
Hotkey.Standby.Cover="StageKit: %1: cover or uncover"
