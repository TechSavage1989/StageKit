AppCapture.Status.Nothing="Capturing nothing: none of the listed windows is open."
AppCapture.Apps="Windows to switch between"
AppCapture.Apps.Add="Add a window"
AppCapture.Ignore="Ignored windows"
AppCapture.Ignore.Tip="Windows this capture never takes, whatever they answer to in the lists above: by program, or by part of a window's title. For a window that would otherwise match, such as a second window with the same word in its title."
AppCapture.Apps.Tip="The apps this one Window Capture is for. Open the app, then choose it here: by its program, or by a window's title for two programs with the same file name. An app that opens is captured. When the app being captured closes, the one you used before it comes back."
AppCapture.Follow="Switch to the active window"
AppCapture.Follow.Tip="Ticked: clicking into one of the apps captures it. Clicking into anything else changes nothing, so the last one stays. Unticked: an app is captured when it opens and stays until it closes."
AppCapture.Change="Switch transition"
AppCapture.ChangeTime="Switch duration"
AppCapture.Change.Fade="A fade"
AppCapture.Change.Cut="A cut (no transition)"
AppCapture.Change.Zoom="Fade and zoom"
AppCapture.Change.FromLeft="Slide in from the left"
AppCapture.Change.FromRight="Slide in from the right"
AppCapture.Change.FromTop="Slide in from the top"
AppCapture.Change.FromBottom="Slide in from the bottom"
AppCapture.Change.Tip="How one window's image gives way to the next when the capture switches. The last image stays until the capture has the new window, and the new one comes in over it this way. Hiding and showing the capture uses Show/Hide transition below instead."
Active.Name="Scene Filter: Automatic Source Switcher (StageKit)"
Active.Status.None="Nothing to show yet: add the captures below."
Active.Status.Showing="Showing: %1"
Active.Status.Held="Showing: %1, switched to by hand. It stays until you hide it."
Active.ByHand="Manual sources"
Active.ByHand.Tip="Other captures in this scene that you show yourself, such as a window capture of your browser. Show one (a Stream Deck key, OBS's show and hide hotkeys, or the eye in the Sources list) and it takes over and stays, whatever window is active. Hide it and the captures above follow your windows again. Showing one hides any other on this list. This filter also adds three hotkeys to the scene in Settings → Hotkeys: next manual source, return to automatic, and toggle manual / automatic."
Hotkey.Active.Next="StageKit: %1: next manual source"
Hotkey.Active.Back="StageKit: %1: return to automatic"
Hotkey.Active.Toggle="StageKit: %1: toggle manual / automatic"
Active.Items="Sources to switch between"
Active.Items.Tip="Captures in this scene, one for each app. Which app a capture belongs to is read from the capture itself. Two captures of programs with the same file name are told apart by their window titles. The first in the list is shown when none of the apps is open."
Active.Follow="Switch to the active window"
Active.Follow.Tip="Ticked: clicking into one of the apps shows its capture. Clicking into anything else changes nothing, so the last one stays. Unticked: a capture is shown when its app opens and stays until that app closes."
Active.Ready="Keep other sources ready"
Active.Ready.Tip="While this scene is showing, the captures of the other open apps keep running, so the one you switch to has its image at once and the change is smooth. Untick to save some graphics memory."
Active.Help="Add this to a scene that has a capture for each of several apps, and list them. One is shown at a time. An app that opens is shown, and so is a capture you aim at another window. When the app that is showing closes, the one you used before it comes back; when none is open, the first in the list is shown. It acts only when one of those things happens, so a capture you show by hand stays until then. Windows only. A minimised window counts as closed."
