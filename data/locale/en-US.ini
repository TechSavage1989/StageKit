Measure.Visible.Tip="Ticked: the edge distance is to the image you can see.\nUnticked: it is to the item's box, as OBS shows it.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Measure.NoShadows="Ignore shadows && outlines"
Measure.NoShadows.Tip="Ticked: a shadow, glow or outline does not count as part of the item, so it may reach closer to the edge.\nUnticked: the effect keeps the distance too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
