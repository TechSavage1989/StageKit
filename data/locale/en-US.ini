ShowHide.Style.Tip="Where the source comes in from and goes out to: across the screen, from past that edge. The nearest screen edge: whichever edge it is closest to. Nowhere: it pops: it grows and shrinks where it is. A source with a bounding box cannot be scaled that way and slides off the nearest edge instead."
