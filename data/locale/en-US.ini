Arrange.SameChosen.Tip="Takes the selected item's position, size, rotation and crop in this scene and gives them to the copies of the same source in the scenes listed under 'Scenes to copy to', and no others (or to the sources listed under 'Sources to copy to', if any, in those scenes). Locked copies are left alone. One step in Edit > Undo."
