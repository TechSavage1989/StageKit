Frame.RuleBrowse="Find its file"
Frame.RuleShape="Its aspect ratio"
Frame.RuleAdd="Remember this ratio"
Frame.Rules.Tip="What the button above fills in. You can edit it: snes9x = 4:3, mgba = 3:2. A name can be part of a window's title. The longest name that fits wins."
Frame.Help="Put this first on a game, window or capture-card source. The source then always has the frame's size, and whatever the game or emulator outputs is fitted inside it, gliding to its new fit when the resolution changes. One scene can then serve every aspect ratio. Add Shadow, Glow & Outline after it and the shadow follows the image."

