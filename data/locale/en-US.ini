Arrange.SameChosen="Copy transform to chosen scenes"
Arrange.SameChosen.Tip="Takes the selected source's position, size, rotation and crop in this scene and gives them to the copies of the same source in the scenes listed under 'Chosen scenes', and no others (or, with 'Copy to: Chosen sources', to the sources listed there, in those scenes). Locked copies are left alone. One step in Edit > Undo."
