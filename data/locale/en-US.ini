Link.Name="Scene Filter: Link Visibility (StageKit)"
Link.Mode="These sources"
Link.Mode.OnlyOne="Show only one at a time"
Link.Mode.Together="Show and hide together"
Link.Mode.Follow="Follow sources"
Link.Mode.Tip="Show only one at a time: showing one hides the others.\nShow and hide together: showing or hiding one does the same to the rest.\nFollow sources: while a lead source is shown, the following sources are shown. Once every lead source is hidden, they are hidden, and one shown by anything else meanwhile is hidden again. Showing or hiding a following source moves nothing else. For a chat column that goes with every capture, say. For modes in one scene (a title and its extras each), Scene Modes is the filter made for it.\nA filter with no lead sources listed has its first linked source as the one lead source."
Link.Items="Sources"
Link.Items.Tip="The sources this filter links. A group counts as one source. With 'Follow sources', these are the sources that follow the lead sources."
Link.Following="Following sources"
Link.Leads="Lead sources"
Link.Leads.Add="Add a source"
Link.Leads.Tip="The sources the following sources go with, for example every capture in a layout scene. When this list is empty, the first source under Following sources leads, as in filters made before this list existed."
Link.LeadRule="Followers show when"
Link.LeadRule.Any="Any lead is shown"
Link.LeadRule.All="All leads are shown"
Link.LeadRule.Tip="Any lead is shown: the following sources show while at least one lead source is shown, and hide once all of them are hidden. Changing from one lead to another never hides them in between.\nAll leads are shown: they show only while every lead source is shown, and hide as soon as one is hidden."
Link.TakeFirst="Make the first a lead"
Link.TakeFirst.Tip="This filter has no lead sources, so the first source under Following sources leads the rest. Press to move that source into Lead sources. It works exactly the same afterwards, and you can then add more lead sources."
Link.Elsewhere="Also in other scenes"
Link.Elsewhere.Add="Add a source"
Link.Elsewhere.Tip="Sources that are shown and hidden with the linked sources wherever they are in your other scenes, for example the camera, or another camera in another scene. It works both ways: hiding one of them in any scene hides the linked sources here and the listed sources everywhere."
Link.LockHidden="Lock hidden sources"
Link.LockHidden.Tip="Ticked: each linked source is locked while it is hidden and unlocked when it is shown, whatever shows or hides it.\nOBS's preview lets a click select a hidden source, so with several captures stacked in one scene a click could pick one you cannot see. A locked source cannot be clicked or moved there.\nA lock you set yourself on a linked source is taken off the next time that source is shown. Sources under 'Also in other scenes' are not locked.\nUnticked: locks are left as they are."
Link.Help="On a scene, one filter per set of sources. While it is on, showing or hiding one of them shows or hides the rest as set above."

