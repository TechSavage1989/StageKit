Shape.Custom="Custom shape"
Shape.Help="Add this next to Auto Frame on the same source, once per shape you want a key for. Switching it on tells Auto Frame the picture's shape, then it switches itself off. Point a Stream Deck OBS plugin Filter key at it, or give it a hotkey (Settings → Hotkeys, under this source). A key set to Automatic hands control back."
