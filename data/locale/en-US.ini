Measure.Visible.Tip="Ticked: the gap is measured to the image you can see.\nUnticked: it is measured to the source's box, as OBS shows it.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Measure.NoShadows="Ignore shadows && outlines"
Measure.NoShadows.Tip="Ticked: a shadow, glow or outline does not count as part of the source, so it may reach closer to the edge.\nUnticked: the effect keeps the gap too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Place.SpotX="Left edge at"
Place.SpotY="Top edge at"
Place.Spot.Tip="Where the source's top left corner goes, in screen pixels from the top left of the screen."
Place.RestoreSize="Restore its size too"
Place.RestoreSize.Tip="Ticked: with Saved position, the source is also given the size it had when the position was saved."
Place.Capture="Save current position"
Place.Capture.Tip="Saves where the source is now, and its size, and sets Destination to Saved position."
Place.Duration="Duration"
Place.Duration.Tip="How long the move takes. 0 moves at once."
Place.Go="Move it now"
Place.Go.Tip="Moves the source now, as switching the filter on does."
Place.Help="On a scene, once per destination. Switching it on moves the source, then it switches itself off again."
SendTo.Name="Source Filter: Move Source (StageKit)"
SendTo.Where="Move it in"
SendTo.Where.OnScreen="Only the scene on screen"
SendTo.Where.Every="Every scene it is in"
SendTo.Where.Chosen="Only one scene I choose"
SendTo.Where.Scene="Scene"
SendTo.Where.Tip="Every scene: the source ends up in the same place in each scene it is in, on screen or not. Only the scene on screen: other scenes keep their own arrangement. Only one scene: always that scene, whichever is on screen."
SendTo.Help="On the source to move, once per position. Switching it on moves the source there, then it switches itself off again."
