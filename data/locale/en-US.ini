Corners.BottomRight="Bottom right"
Corners.Edges="Edges"
Corners.Inset="Trim edges"
Corners.Inset.Tip="Cuts this much off all four sides before shaping the corners. The source keeps its size; the trimmed part becomes see-through."
Corners.Soft="Soften edge"
Corners.Soft.Tip="Fades the picture out towards its edge over this distance."
Corners.Line="Outline"
Corners.Border="Outline width"
Corners.BorderColor="Outline colour"
Corners.BorderOpacity="Outline opacity"
Corners.ScreenPx="Sizes as seen on screen"
Corners.ScreenPx.Tip="On: sizes are in pixels of the finished scene, so a 40 px corner looks the same on a big item and a small one. Off: sizes are in the source's own pixels and shrink or grow with the item."

Fit.Name="Fit to Space (StageKit)"
Fit.Item="Item"
Fit.Item.None="(choose an item)"
Fit.Box="Fit it in"
Fit.Box.Scene="The whole screen"
Fit.Box.Custom="A box I set"
Fit.BoxX="Box left"
Fit.BoxY="Box top"
Fit.BoxWidth="Box width"
Fit.BoxHeight="Box height"
Fit.Box.Free="The free space around it"
Fit.Box.Tip="The whole screen: a picture of the screen's shape fills it; any other shape floats in the middle with the margin. A box I set: the same, in a box you give. The free space around it: the item grows as large as it can where it is, keeping the gap below from the screen's edges and from every other item. Drag the item to another part of the scene and it takes the free space there."
Fit.Gap="Gap to edges and items"
Fit.Visible.Tip="Ticked: the items around it are measured by what they draw, and an item that draws nothing is not in the way.\nUnticked: they go by their boxes.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.NoShadows.Tip="Ticked: shadows, glows and outlines do not count, neither the item's own nor the other items'. The gap is kept from the pictures.\nUnticked: the effects keep the gap too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.Glide="Glide to a new space over"
Fit.Glide.Tip="How long the item takes to glide to a new size and place when the free space changes, for example when another item is moved, shown or hidden. 0 changes at once."
Fit.Skip="Items never in the way"
Fit.Skip.Tip="Items the free space ignores, such as a camera that is meant to overlap the game. Backgrounds and frames need not be listed: anything the item's place lies inside is not in the way."
Fit.Tolerance="Tolerance"
Fit.Tolerance.Tip="For the free space. When something sticks a little way into the space, the picture can either be made that much smaller and keep the whole space, or keep its size and lose the part of the space beside that thing. Up to this many pixels smaller, it keeps the whole space. 0: the biggest picture always wins, even by one pixel. The gap is kept either way."
Fit.Margin="Margin for other shapes"
Fit.Margin.Tip="For the whole screen or a box: a picture with the box's own shape fills the box; any other shape, such as an emulator's squarer picture on a widescreen canvas, is kept this far from the box's edges and centred. For the free space: the item is always kept exactly this far from the screen's edges and from the other items, at its nearest."

