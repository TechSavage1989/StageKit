Place.Help="Add this filter to a scene, once per destination. Switching it on moves the item, then it switches itself off again. Trigger it from the eye icon, a Stream Deck OBS plugin Filter key, or its hotkey (Settings → Hotkeys, under this scene)."
SendTo.Name="Source Filter: Move Source (StageKit)"
SendTo.Where="Move it in"
SendTo.Where.OnScreen="Only the scene on screen"
SendTo.Where.Every="Every scene it is in"
SendTo.Where.Chosen="Only one scene I choose"
SendTo.Where.Scene="Scene"
SendTo.Where.Tip="Every scene: the source ends up in the same place in each scene it is in, on screen or not. Only the scene on screen: other scenes keep their own arrangement. Only one scene: always that scene, whichever is on screen."
SendTo.Help="Add this filter to the source you want to move, such as your camera, once per spot. Choose a corner, or drag the source where you want it in the preview and press 'Save the item's current spot'. Switching the filter on moves the source there, then it switches itself off again. On a Stream Deck, use the OBS plugin's Filter key: pick this source and this filter. Name each filter after its spot so the keys are easy to tell apart."
