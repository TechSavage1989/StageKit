Standby.OwnShape="Picture keeps its shape"
Standby.OwnShape.Tip="Ticked: while nothing is captured the picture is shown whole, in its own shape, as tall as the capture last was. Unticked: it fills the size the capture last had, with what does not fit cut off."
Standby.Style="Change with"
Standby.Style.Fade="A fade"
Standby.Style.Cut="A cut (no transition)"
Standby.Style.SlideLeft="Slide away to the left"
Standby.Style.SlideRight="Slide away to the right"
