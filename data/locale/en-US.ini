Shape.Automatic="Automatic (work it out)"
Shape.Snes="SNES / NES (64:49)"
Shape.Custom="Custom ratio"
Shape.Help="Add this next to Auto Frame on the same source, once per aspect ratio you want a hotkey or key for. Switching it on tells Auto Frame the image's aspect ratio, then it switches itself off. On a Stream Deck, StageKit's Set Aspect Ratio key does the same with no filter at all. This filter is for a hotkey (Settings → Hotkeys, under this source) or the OBS plugin's Filter key. One set to Automatic hands control back."
