Frame.Known="Start from each program's usual shape"
Frame.Known.Tip="A program starts from the shape its picture had the last time it was captured, or from the usual shape of a common emulator, so the picture is right from the first frame. What is then seen on screen corrects it."
Frame.Forget="Forget shapes seen before"
Frame.Forget.Tip="Clears the shapes remembered for programs from earlier sessions. Shapes you saved yourself are kept. Remembered now:"
Frame.Forget.None="none."
Frame.RuleProgram="Program or window"
Frame.RuleProgram.Tip="A program's file name, or part of a window's title. Use the title for two programs with the same file name, for example a special build of an emulator. You can shorten what you pick: part of the name is enough. When several saved shapes fit, the one with the longest name is used."
Frame.RuleBrowse="Find its file"
Frame.RuleShape="Its picture shape"
Frame.RuleAdd="Remember this shape"
Frame.Rules.Tip="What the button above fills in. You can edit it: snes9x = 4:3, mgba = 3:2. A name can be part of a window's title. The longest name that fits wins."
Frame.Help="Put this first on a game, window or capture-card source. The source then always has the frame's size, and whatever the game or emulator outputs is fitted inside it, gliding to its new fit when the resolution changes. One scene can then serve every picture shape. Add Shadow, Glow & Outline after it and the shadow follows the picture."

