Modes.OnGroup="This filter does nothing on a group. Put it on the scene that holds the group."
Modes.Now="Mode now"
Modes.Now.Tip="The mode that is on. Choosing another here turns it on now, as a key would, but never changes scene."
Modes.None="(No mode)"
Modes.NewName="New mode name"
Modes.NewName.Tip="Type a name, then press 'Add mode'. Any name will do, for example Game, Chat or Intermission. Two modes may have the same name."
Modes.Add="Add mode"
Modes.Add.Tip="Adds a mode with the name typed above. Its keys and hotkey follow it when it is renamed."
Modes.Template="From template"
