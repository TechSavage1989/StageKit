ShowIn.Name="Source Filter: Show in Scenes (StageKit)"
ShowIn.Status.Shown="This filter is the switch. As it is now: shown."
ShowIn.Status.Hidden="This filter is the switch. As it is now: hidden."
ShowIn.Sources="Sources to show and hide"
ShowIn.Sources.Add="Add a source"
ShowIn.Sources.Tip="The sources this switch shows and hides. Leave the list empty to act on the source this filter is on."
ShowIn.Where="In"
ShowIn.Where.Every="Every scene they are in"
ShowIn.Where.Listed="The scenes listed below"
ShowIn.Where.Tip="Where the sources are shown and hidden: in every scene that has them, or only in the scenes you list."
ShowIn.Scenes="Scenes"
ShowIn.Scenes.Tip="Only in these scenes are the sources shown and hidden."
ShowIn.OnMeans="When this is on"
ShowIn.OnMeans.Shown="They are shown"
ShowIn.OnMeans.Hidden="They are hidden"
ShowIn.OnMeans.Tip="What switching this filter on does. Switching it off does the opposite, so one Stream Deck key shows and hides them."
ShowIn.WithLinked="Move's linked sources too"
ShowIn.WithLinked.Tip="Ticked: the sources that these sources take along are shown and hidden with them.\nThose are the ones chosen under Linked source in the sources' Move Source filters, and in Move Scene Item filters that move them.\nUnticked: only the sources listed."
ShowIn.HideStandby="Hide shows Standby Image"
ShowIn.HideStandby.Tip="Ticked: a press that hides the sources covers each one that has a Standby Image filter with its image instead, the way that filter is set to change, and a press that shows them takes the image away. Nothing around them moves. For a camera, a capture card or a display capture.\nThe image covers the source in every scene it is in. A source without an enabled Standby Image filter is hidden as usual.\nThe Standby Image's own Show when source is hidden is another thing: it stands in whenever anything hides the source in a scene.\nUnticked: the sources are hidden."
ShowIn.Restore="Show only what it hid"
ShowIn.Restore.Tip="Ticked: a press that hides notes exactly what it hid (and which sources it covered with their Standby Image), and the next press that shows brings back only those, while they are still hidden. A source that was already hidden, such as a full-screen camera kept for another layout, stays hidden. With nothing noted, a press that shows does nothing. The notes are kept when OBS restarts.\nThe switch then reads on while nothing it hid is still hidden, so a toggle key always hides and then restores.\nUnticked: a press that shows shows every listed source."
ShowIn.Follow="Follow what is shown"
ShowIn.Follow.Tip="Ticked: this switch also goes by what is shown. When something else shows or hides its sources (a Link Visibility filter, the eye icon, another key), the switch turns on or off to match, so a Stream Deck key's light stays true.\nIt reads 'shown' only while every one of its sources is shown in the scenes it covers. Matching the switch never shows or hides anything.\nUnticked: the switch stays as it was last pressed."
ShowIn.GoTo="Switch to scene"
ShowIn.GoTo.None="Stay in this scene"
ShowIn.GoTo.Tip="When a press shows this switch's sources, OBS then changes to this scene with its current transition (in Studio Mode, the preview changes). Nothing changes when the scene on screen already has one of the sources.\nFor a Stream Deck key that should also change scene. A press that hides the sources, and 'Do it now', never change scene.\nStay in this scene: the scene is left as it is."
ShowIn.ApplyNow="Do it now"
ShowIn.Help="One switch for showing and hiding sources across scenes. On a Stream Deck, use StageKit's Show in Scenes key (or the OBS plugin's Filter key on this source and this filter): each press switches the filter on or off, and the sources are shown or hidden in the scenes chosen. It acts when it is switched, so anything you show or hide by hand stays until the next press."
Standby.Name="Source Filter: Standby Image (StageKit)"
Standby.Status.Showing="The source has no image: the standby image is showing."
Standby.Status.Waiting="The source is showing. The standby image takes its place when it has no image."
Standby.Picture="Image"
Standby.Picture.Start="The standby image"
Standby.Picture.File="An image or video file"
Standby.Picture.Source="Another source"
Standby.Picture.Tip="What is shown in the source's place while it has no image (no game or window captured, no camera signal). The standby image is the one set on the StageKit dock's Standby & Ambient tab."
Standby.File="File"
Standby.File.Filter="Images and videos (*.png *.jpg *.jpeg *.bmp *.tga *.gif *.webp *.mp4 *.mov *.mkv *.webm *.avi *.m4v);;All files (*.*)"
Standby.Source="Source"
Standby.Source.None="(none)"
Standby.OwnShape="Keep image's aspect ratio"
Standby.OwnShape.Tip="Ticked: while the source has no image, the standby image is shown whole, in its own aspect ratio, as tall as the source last was. Unticked: it fills the size the source last had, with what does not fit cut off."
Standby.Style="No-signal transition"
Standby.Style.Fade="A fade"
Standby.Style.Cut="A cut (no transition)"
Standby.Style.SlideLeft="Slide away to the left"
Standby.Style.SlideRight="Slide away to the right"
Standby.Style.SlideUp="Slide away upwards"
Standby.Style.SlideDown="Slide away downwards"
Standby.Style.WipeLeft="Wipe to the left"
Standby.Style.WipeRight="Wipe to the right"
Standby.Style.WipeUp="Wipe upwards"
Standby.Style.WipeDown="Wipe downwards"
Standby.Style.Zoom="Fade and zoom"
Standby.Style.Morph="Morph"
Standby.Style.Tip="Used while the source is shown but has nothing to show (no game or window attached, no camera signal): how the image gives way to the source when it starts. It comes back the same way in reverse when the source stops. Hiding and showing the source in a scene uses Show/Hide transition below instead."
Standby.Fade="Duration: image to capture"
Standby.Fade.Tip="How long the change from the image to the source takes."
Standby.Back="Duration: capture to image"
Standby.Back.Tip="How long the change back to the image takes when the source stops."
Standby.GlideSize="Animate the size change"
Standby.GlideSize.Tip="Ticked: the size glides between the image's shape and the source's over the same time. Unticked: the size changes at once and only the image changes over."
Standby.Cover="Cover the source now"
Standby.Cover.Tip="Brings the image in over a source that is running, and takes it away again: a way to hide the source without leaving a hole. It works on any source: a capture, a camera, a capture card. The same cover is this filter's hotkey (cover or uncover), the Stream Deck Standby Image key, and what Hide shows Standby Image does in Auto Capture, the Automatic Window Switcher and Show in Scenes."
Standby.Help="Put this on a Game Capture, Window Capture, camera or other live source. While it has no image (no game or window is attached, no signal), the standby image is shown in its place, so there is no empty hole in the scene. When the source starts, the image's shape glides to the source's shape as it fades into it; when it stops, it glides back. A capture that is attached and showing black is left alone. Switch this filter off with its eye, or StageKit's Standby Image key on a Stream Deck, to go without the image."
Corners.Name="Source Filter: Corners & Edges (StageKit)"
Corners.Style="Corner style"
Corners.Style.Round="Rounded"
Corners.Style.Cut="Cut off (chamfer)"
Corners.Style.Notch="Notched (square cut)"
Corners.Style.Scoop="Scooped (curved in)"
Corners.Size="Corner size"
Corners.Which="Which corners"
Corners.TopLeft="Top left"
Corners.TopRight="Top right"
Corners.BottomLeft="Bottom left"
Corners.BottomRight="Bottom right"
Corners.Edges="Edges"
Corners.Inset="Trim edges"
Corners.Inset.Tip="Cuts this much off all four sides before shaping the corners. The source keeps its size; the trimmed part becomes see-through."
Corners.Soft="Soften edge"
Corners.Soft.Tip="Fades the image out towards its edge over this distance."
Corners.Line="Border"
Corners.Border="Border width"
Corners.BorderColor="Border colour"
Corners.BorderOpacity="Border opacity"
Corners.ScreenPx="Sizes in screen pixels"
Corners.ScreenPx.Tip="Ticked: sizes are in pixels of the finished scene, so a 40 px corner looks the same on a large source and a small one. Unticked: sizes are in the source's own pixels and shrink or grow with it."

Fit.Name="Scene Filter: Fit to Space (StageKit)"
Fit.Item="Source"
Fit.Item.None="(choose a source)"
Fit.Box="Fit area"
Fit.Box.Scene="The whole screen"
Fit.Box.Custom="A box I set"
Fit.BoxX="Box left"
Fit.BoxY="Box top"
Fit.BoxWidth="Box width"
Fit.BoxHeight="Box height"
Fit.Box.Free="Free space around source"
Fit.Box.Tip="The whole screen: an image of the screen's shape fills it; any other shape floats in the middle with the margin. A box I set: the same, in a box you give. Free space around source: the source grows as large as it can where it is, keeping the gap below from the screen's edges and from every other source. Drag the source to another part of the scene and it takes the free space there."
Fit.Gap="Gap"
Fit.Visible.Tip="Ticked: the sources around it are measured by what they draw, and a source that draws nothing is not in the way.\nUnticked: they go by their boxes.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.NoShadows.Tip="Ticked: shadows, glows and outlines do not count, neither the source's own nor the other sources'. The gap is kept from the images.\nUnticked: the effects keep the gap too.\nThis is the filter's own setting; the StageKit dock's Arrange options do not change it."
Fit.Glide="Move duration"
Fit.Glide.Tip="How long the source takes to glide to a new size and place when the free space changes, for example when another source is moved, shown or hidden. 0 changes at once."
Fit.Skip="Ignored sources"
Fit.Skip.Tip="Sources the free space ignores, such as a camera that is meant to overlap the game. Backgrounds and frames need not be listed: anything the source's place lies inside is not in the way."
Fit.OnGroup="This filter is on a group, where it does nothing: a group is only as large as what is in it. Add Fit to Space to the scene instead (right-click the scene, Filters) and choose the group as its source."
Fit.Resize="Resize to fit"
Fit.Resize.Tip="Ticked: the source is made as large as its space allows, keeping its shape.\nUnticked: the source keeps the size it has on the screen and is only moved, to where Align in the space puts it in its space. If the filter had already resized it, unticking gives it back the size it had before. Resize it yourself in the preview and that becomes the size it keeps.\nTicked, a source you resize by hand glides back to fill its space a moment after you let go."
Fit.Priority="Space priority"
Fit.Priority.Shares="Shares space"
Fit.Priority.First="Takes space first"
Fit.Priority.MakesRoom="Makes room"
Fit.Priority.Tip="Which of the scene's fitted sources gets its space when two want the same room (only in the free space). Takes space first: this source takes the space it would have if those that share space or make room were not there, and never moves or shrinks for a source that shares space or makes room; those fit around it. Shares space: as it always was, each source goes by where the others are going and they make room for each other. Makes room: this source always fits around every source that shares space or takes space first. Two sources with the same setting share. A source set to Priority by list order counts as sharing space towards one that is not."
Fit.ListPriority="Priority by list order"
Fit.ListPriority.Tip="Ticked, Space priority is not used: among the fitted sources of this scene that have this ticked, one higher in the scene's filter list takes its space first and the ones below fit around it. Move a filter up or down and the sources glide to their new places. A Scene Fit counts at its place in the list, its sources in its own order. Towards a fitted source without this ticked it counts as Shares space."
Fit.Toward="Align in the space"
Fit.Toward.Tip="Where the source lies in its space when it does not fill it: an image of another shape than the space, or a source that keeps its size. Always obeyed, whatever lies beside it, for every source and every layout. The middle: the room left over is the same on both sides. A side or a corner: it lies against that side, the gap away, and the room left over is all on the other side. Listed row by row as the nine squares of OBS's own bounding box alignment.\nAlso in a layout made by hand with the filter off: switching the filter on moves a source to where this puts it."
Fit.Toward.Middle="• The middle"
Fit.Toward.Top="↑ The top"
Fit.Toward.Bottom="↓ The bottom"
Fit.Toward.Left="← The left"
Fit.Toward.Right="→ The right"
Fit.Toward.TopLeft="↖ The top left"
Fit.Toward.TopRight="↗ The top right"
Fit.Toward.BottomLeft="↙ The bottom left"
Fit.Toward.BottomRight="↘ The bottom right"
Fit.Share="Sync position to scenes"
Fit.Share.Tip="Each time this filter has put its source in place while its scene is on screen, the same source in the scenes listed here is given exactly that place and size, so it is already there when you switch to one of them. Scenes not listed are never touched: the source keeps its own place there. A listed scene that is on screen at that moment is left alone, so nothing jumps in view. Locked copies are moved too. The link holds both ways: a listed scene with a Fit to Space of its own for the source gives its place back to this scene when it is the one on screen."
Fit.SkipFillOn="Overlap only when it fills"
Fit.SkipFillOn.Tip="For the ignored sources, such as a camera. Unticked: the fitted source always goes under them. Ticked: it goes under them only while it would fill its space; a source that would leave empty room (a narrow window on a wide screen) is fitted beside them instead, like beside any other source. With The whole screen or A box I set and Make room if not filling: ticked, the source leaves the whole screen for the room beside the other sources while it does not fill; unticked, it always takes the whole screen. A Stream Deck key, Fit to Space Overlap, switches this."
Fit.MakeRoom="Make room if not filling"
Fit.MakeRoom.Tip="For The whole screen or A box I set. An image that fills the screen is fitted there as ever, over the other sources. One that does not fill it (a 4:3 standby image on a widescreen canvas) is fitted into the largest space clear of the other sources instead, keeping the margin as a gap, so it sits beside a camera rather than over a sliver of it. Needs Overlap only when it fills ticked below; the two rules under it say what counts as filling."
SceneFit.MakeRoom.Tip="For The whole screen or A box I set. An image that fills the screen is fitted there as ever, over the other sources. One that does not fill it (a 4:3 standby image on a widescreen canvas) is fitted into the largest space clear of the other sources instead, keeping the margin as a gap, so it sits beside a camera rather than over a sliver of it. Needs the Scene Fit's own Overlap only when it fills ticked, above the sources' settings; the two rules below say what counts as filling."
Fit.RoomFor="Make room for"
Fit.RoomFor.Tip="The sources room is made for while the image does not fill the screen. With none listed, room is made for every other source. Backgrounds and frames need not be left out: anything the middle of the screen lies inside is not in the way. While the image fills the screen it lies over all of them."
Fit.RoomUsePct.Tip="The image fills the screen when it would cover at least the percentage below of it (of the screen less the margin, for an image of another shape). If Use edge gaps is ticked too, meeting either one is enough. With neither ticked, it never counts as filling and always makes room."
Fit.RoomFill.Tip="How much of the screen the image must cover to take the whole screen, over the other sources. At 95%, a widescreen game takes a widescreen canvas, and a 4:3 image, which would cover about three quarters, is fitted beside the camera instead."
Fit.RoomUsePx.Tip="The image fills the screen when it reaches close enough to all four edges of it (of the screen less the margin, for an image of another shape). Each slider is the widest gap allowed at that edge. If Use fill percentage is ticked too, meeting either one is enough."
Fit.RoomPx.Tip="The widest empty gap allowed between the image and this edge for it to count as filling the screen. 0 means it must reach this edge. All four edges must be within their gaps; if one gap is wider, the image makes room for the other sources instead. In canvas pixels."

Fit.SkipUsePct="Use fill percentage"
Fit.SkipUsePct.Tip="Overlap the ignored sources (the camera) when the fitted source would cover at least the percentage below of its space. If Use edge gaps is ticked too, meeting either one is enough. With neither ticked, the fitted source always goes beside the ignored sources."
Fit.SkipUsePx="Use edge gaps (pixels)"
Fit.SkipUsePx.Tip="Overlap the ignored sources (the camera) when the fitted source reaches close enough to all four edges of its space. Each slider is the widest gap allowed at that edge. Example: a window that fills the width and leaves 20 px above and below overlaps the camera with top and bottom at 30; a narrower window that leaves 300 px at the sides goes beside the camera unless left and right are 300 or more. If Use fill percentage is ticked too, meeting either one is enough."
Fit.SkipPxTop="Top gap up to"
Fit.SkipPxBottom="Bottom gap up to"
Fit.SkipPxLeft="Left gap up to"
Fit.SkipPxRight="Right gap up to"
Fit.SkipPx.Tip="The widest empty gap allowed between the fitted source and this edge of its space for it to overlap the ignored sources. 0 means it must reach this edge. All four edges must be within their gaps; if one gap is wider, the source is fitted beside the ignored sources instead. In canvas pixels."
Fit.SkipFill="Fill needed to overlap"
Fit.SkipFill.Tip="How much of its space the fitted source must fill to go under the ignored sources. At 98%, a window that fills the screen stays under the camera, and one that would fill less is fitted beside the camera."
Fit.Tolerance="Size tolerance"
Fit.Tolerance.Tip="For the free space. When something sticks a little way into the space, the image can either be made that much smaller and keep the whole space, or keep its size and lose the part of the space beside that thing. Up to this many pixels smaller, it keeps the whole space. 0: the biggest image always wins, even by one pixel. The gap is kept either way."
Fit.Margin="Margin for other shapes"
Fit.Margin.Tip="For the whole screen or a box: an image with the box's own shape fills the box; any other shape, such as an emulator's squarer image on a widescreen canvas, is kept this far from the box's edges and centred. For the free space: the source is always kept exactly this far from the screen's edges and from the other sources, at its nearest."

List.Choose="(choose to add)"
List.Empty="Nothing added yet."
List.Remove.Tip="Takes this one off the list."
Change.With="Transition"
Change.Cut="A cut (no transition)"
Change.Keep="Keep each source's own"
Change.Tip="How a source appears and disappears when this filter shows or hides it. Keep each source's own: this filter sets nothing, and every source keeps the show and hide transitions it has. Otherwise a fade, a cut or any other transition OBS has, set as OBS's own show and hide transition on the source (the ones in its right-click menu)."
Change.ShowWith="Show transition"
Change.ShowWith.Tip="How a source appears when this filter shows it, and disappears when it hides it unless Hide transition says otherwise. Keep each source's own: this filter sets nothing, and every source keeps the show and hide transitions it has. Otherwise a fade, a cut or any other transition OBS has; its own settings, such as the way a slide goes, appear below it. It is set as OBS's own show and hide transition on the source (the ones in its right-click menu)."
Change.Group="Show/Hide transition"
Change.For="Settings for"
Change.For.All="All sources"
Change.For.Tip="All sources: how every source on the list changes, unless it has settings of its own. A source's name: that source's own transition, duration and settings, for showing and for hiding."
Change.Usual="As for all sources"
Change.Nearest="Off the nearest edge"
Change.HideWith="Hide transition"
Change.HideSame="The same as showing"
Change.HideWith.Tip="How a source disappears when this filter hides it. The same as showing: the show transition, its duration and its settings are used for hiding too. Or a transition of its own with its own settings: a slide up to show and a slide down to hide, say."
Change.Time="Duration"
Change.ShowTime="Show duration"
Change.HideTime="Hide duration"
Change.Duration.Tip="How long the transition takes."
List.AddItem="Add a source"
List.AddFilter="Add a filter"
List.AddScene="Add a scene"
List.AddProgram="Add a program"

Morph.Name="Morph (StageKit)"
Morph.Others="Unpaired: scene change"
Morph.Others.Fade="Fade"
Morph.Others.Zoom="Fade and zoom"
Morph.Others.Slide="Slide off the nearest edge"
Morph.Alone.Fade="Morph: fade"
Morph.Alone.Zoom="Morph: fade and zoom"
Morph.Alone.Slide="Morph: slide off nearest edge"
Morph.Others.Tip="For a change of scene. Whatever shows the same source in both scenes glides from its place and size in the one to its place and size in the other. This is how the rest comes and goes: sources that are in only one of the two scenes. Make room slides each off the screen edge nearest to it that lies away from what morphs in (and in from the edge away from what morphs out). A source shown or hidden by itself with Morph goes by Unpaired: show or hide instead."
Morph.PairMain="Morph the main image"
Morph.PairMain.Tip="Besides sources that are in both scenes, the largest source left over in each scene is taken for the main image, and the one changes into the other as it moves and resizes: a game in one scene and a window in the next, say. Unticked, those two are cross-faded where they are like any other source."
Morph.Seen="Use visible pixels"
Morph.Seen.Tip="When two different sources change into each other, they are matched by the part of each that shows, not by their boxes: empty room around an image (a shadow's side, a transparent border, a group wider than its contents) is left out, so the one image lands exactly on the other. Each is looked at once as the change begins. Unticked, the whole box of the one changes into the whole box of the other."
Morph.NoShadows.Tip="When two different sources change into each other, the images themselves are matched: the room a Shadow, Glow & Outline filter takes round an image is left out of the matching, so one image lands exactly on the other. The shadows, glows and outlines are still drawn, each fading with its own image. Unticked, the effects count as part of the image."
Morph.Layer="Morph (StageKit, in progress)"
Morph.RuleGroup="A rule for two scenes"
Morph.RuleFrom="From scene"
Morph.RuleTo="To scene"
Morph.AnyScene="(any scene)"
Morph.RuleBoth="Both ways"
Morph.RuleBoth.Tip="The rule also holds for the change back, from the second scene to the first."
Morph.RuleStyle="Change with"
Morph.RuleStyle.Morph="Morph"
Morph.RuleStyle.Fade="Cross-fade"
Morph.RuleStyle.Cut="Cut"
Morph.RuleStyle.Tip="How the change between these two scenes is made: the morph with the settings below, a plain cross-fade, or a cut to the new scene."
Morph.RuleAdd="Save this rule"
Morph.Rules="Rules for scenes"
Morph.Rules.Tip="A change from one scene to another that is made another way than the rest: choose the two scenes, set how the change is made and save. Choosing two scenes that have a rule shows it, to change and save again. A rule naming both scenes comes before one with (any scene). How long the change lasts is still the transition's own duration in OBS."
Morph.Alone="Unpaired: show or hide"
Morph.Alone.Tip="When Morph is a source's own show or hide transition (in Show in Scenes, Link Visibility, Scene Transitions and the like): how a source comes in or goes out when no other source is hidden or shown with Morph at the same moment for it to change into. Morph: fade, Morph: fade and zoom and Morph: slide off nearest edge are drawn by Morph; Make room slides it right off the screen, away from the change under way in its scene; a cut, at once; or any other transition you have, with its own settings below it. Every way but Make room stays inside the source's own frame, as OBS's show and hide transitions do."
Morph.AloneOwn="Unpaired transition"
Morph.Item.Tip="A source hidden with Morph and another shown with Morph at the same moment change into each other: the one moves, resizes and turns into the other. Which two go together follows the links, the ones made here and the ones in the Morph transition's own settings; besides those, the largest source hidden and the largest shown."
FadeZoom.Name="Fade and Zoom (StageKit)"
MakeRoom.Name="Make Room (StageKit)"
MakeRoom.Option="Make room"
MakeRoom.Way="Make room by"
MakeRoom.Way.Push="Away from the morph"
MakeRoom.Way.Nearest="Nearest edge only"
MakeRoom.Way.Tip="For Make room. A source with nothing to change into slides off the screen. Away from the morph: of the screen edges that lie away from what morphs in, the one it has least far to go to (sources coming in arrive from the edge away from what morphs out). As a source's own show or hide transition, away from whatever else is shown or hidden in its scene at that moment. Nearest edge only: the nearest edge, whatever morphs."
MakeRoom.Fade="Fade while moving"
MakeRoom.Fade.Tip="For Make room. Ticked, a source fades out as it slides off (and in as it slides in). Unticked, it stays whole until it is off the screen."
FadeZoom.Zoom="Smallest size"
FadeZoom.Zoom.Tip="How small the image is when it is all but gone, as a share of its size. What appears grows from this size as it fades in; what disappears shrinks to it as it fades out. At 100% it is a plain fade."
Morph.LinkA="Link this source"
Morph.LinkB="With this source"
Morph.LinkAdd="Add this link"
Morph.Links="Linked sources"
Morph.Links.Tip="Two different sources that are to count as the same thing: where one scene has the one and the next scene has the other, the one moves, resizes and changes into the other, as a source in both scenes does. Choose the two, then press Add this link. Add as many links as you like; a source linked to several others goes with whichever of them the other scene shows. Links made in any Morph count everywhere: for changes of scene, and for sources shown and hidden with Morph by a filter."

