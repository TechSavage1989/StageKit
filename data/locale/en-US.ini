Frame.TrimKeep="Keep this trim for this program"
Frame.TrimKeep.Tip="Saves the image as it is trimmed now as the aspect ratio for the program being captured, and goes back to trimming automatically. Use it after 'Measure the bars now' or after setting the amounts by hand. Other programs are still worked out by themselves."
Frame.Rules="Saved aspect ratios"
Frame.ScopedRules="Saved app/window ratios"
Frame.Scoped.Application="Application:"
Frame.Scoped.Window="Window:"
Frame.ScopedRules.Tip="Ratios saved by the Application or Window name keys. A complete window title overrides its application's ratio, only within that same application. If no window rule matches, its application ratio is used. Press a row to remove it."
Frame.TrimWait="Keep aspect ratio for"
Frame.TrimWait.Tip="How long a different aspect ratio must be clearly on screen before the image changes to it. Until then the one already found is kept."
Frame.TrimX="Trim left and right"
Frame.TrimY="Trim top and bottom"
Frame.Sharp="Sharp pixels"
Frame.Glide="Move duration"
Frame.SizeGroup="1. Frame size"
Frame.PictureGroup="2. Image"
Frame.BarsGroup="3. Black bars"
Frame.ProgramsGroup="4. Aspect ratio for each program"
