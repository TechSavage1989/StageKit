<!doctype html>
<html>
	<head lang="en">
		<title>StageKit scene mode</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
		<style>
			body, summary, p {
				font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
				font-size: 9pt;
			}
			details { margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; }
			summary { color: #969696; cursor: pointer; padding: 2px 0 8px 2px; outline: none; }
			summary:hover { color: #d8d8d8; }
			details p { color: #8a8a8a; line-height: 1.45; margin: 8px 4px 4px 4px; }
		</style>
	</head>

	<body>
		<sdpi-item label="Mode">
			<sdpi-select setting="target" datasource="getModes" placeholder="Choose a mode" show-refresh></sdpi-select>
		</sdpi-item>
		<sdpi-item label="On press">
			<sdpi-select setting="press" default="on">
				<option value="on">Switch on</option>
				<option value="toggle">Toggle</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Mode type" title="What the mode shows, for the key&#x27;s image. Automatic takes the Mode type set in OBS.">
			<sdpi-select setting="sourceType" placeholder="Automatic (the mode&#x27;s type)">
				<option value="auto">Automatic (the mode&#x27;s type)</option>
				<optgroup label="Captures &amp; games">
					<option value="game">Game</option>
					<option value="retro">Retro game</option>
					<option value="emulator">Emulator</option>
					<option value="console">Console</option>
					<option value="handheld">Handheld</option>
					<option value="linked_handheld">Linked handheld screen</option>
					<option value="capture_card">Capture card (internal)</option>
					<option value="window">Window</option>
					<option value="display">Display</option>
					<option value="tablet">Tablet</option>
				</optgroup>
				<optgroup label="Apps">
					<option value="art_app">Art app</option>
					<option value="app_3d">3D app</option>
					<option value="sculpting">Sculpting app</option>
					<option value="cad">CAD app</option>
					<option value="code_editor">Code editor</option>
					<option value="office">Office / documents</option>
					<option value="video_player">Video player</option>
					<option value="reference">Reference board</option>
				</optgroup>
				<optgroup label="Cameras">
					<option value="camera">Camera / webcam</option>
				</optgroup>
				<optgroup label="Overlays">
					<option value="countdown">Countdown</option>
				</optgroup>
				<optgroup label="Status &amp; holding screens">
					<option value="live">Live / on air</option>
					<option value="recording">Recording</option>
					<option value="paused">Paused</option>
					<option value="muted">Muted</option>
					<option value="offline">Offline</option>
					<option value="privacy">Camera off</option>
					<option value="raid">Raid / host</option>
					<option value="starting">Starting soon</option>
					<option value="brb">Be right back</option>
					<option value="intermission">Intermission</option>
					<option value="technical">Technical difficulties</option>
					<option value="ending">Ending</option>
				</optgroup>
				<optgroup label="Layout markers">
					<option value="column_chat">Chat column</option>
					<option value="column_handheld">Handheld column</option>
				</optgroup>
				<optgroup label="Activities">
					<option value="speedrun">Speedrun</option>
					<option value="music_production">Music production</option>
					<option value="cooking">Cooking</option>
					<option value="irl">IRL / outdoors</option>
					<option value="tutorial">Tutorial</option>
					<option value="unboxing">Unboxing</option>
					<option value="fitness">Fitness</option>
					<option value="reading">Reading</option>
					<option value="watch_party">Watch party</option>
					<option value="charity">Charity</option>
					<option value="just_chatting">Just chatting</option>
					<option value="podcast">Podcast</option>
					<option value="interview">Interview / guest</option>
				</optgroup>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Palette">
			<sdpi-select setting="palette" default="mono">
				<option value="mono">Mono</option>
				<option value="violet">Violet</option>
				<option value="ocean">Ocean</option>
				<option value="forest">Forest</option>
				<option value="ember">Ember</option>
				<option value="neon">Neon</option>
			</sdpi-select>
		</sdpi-item>

		<details>
			<summary>OBS connection</summary>
			<sdpi-item label="Address">
				<sdpi-textfield setting="host" global placeholder="127.0.0.1"></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="Port">
				<sdpi-textfield setting="port" global placeholder="4455"></sdpi-textfield>
			</sdpi-item>
			<sdpi-item label="Password">
				<sdpi-password setting="password" global></sdpi-password>
			</sdpi-item>
			<p>
				In OBS: Tools &rarr; WebSocket Server Settings. Tick &ldquo;Enable WebSocket server&rdquo;, then
				&ldquo;Show Connect Info&rdquo; for the port and password. One connection serves every StageKit key.
			</p>
		</details>
	</body>
</html>
