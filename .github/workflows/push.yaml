name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Check Out Release Notes 📝
        uses: actions/checkout@v4
        if: fromJSON(steps.check.outputs.validTag)
        with:
          path: repo-source
          sparse-checkout: docs/releases

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          : Release body: the notes from docs/releases, then the checksums
          notes="${{ github.workspace }}/repo-source/docs/releases/${{ steps.check.outputs.version }}.md"
          : > ${{ github.workspace }}/CHECKSUMS.txt
          if [[ -f "${notes}" ]]; then
            tail -n +2 "${notes}" >> ${{ github.workspace }}/CHECKSUMS.txt
            echo "" >> ${{ github.workspace }}/CHECKSUMS.txt
          fi
          echo "### Checksums" >> ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

  # Publishes a release without anyone pushing a tag by hand: when the newest
  # notes file in docs/releases/ (named <version>.md) has no tag yet, the
  # build from this push to main is released under that version, using the
  # repository's own token.
  pending-release:
    name: Find Unpublished Release 🔎
    if: github.ref_type == 'branch' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.find.outputs.version }}
      prerelease: ${{ steps.find.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - name: Find Unpublished Release 🔎
        id: find
        run: |
          : Find Unpublished Release 🔎
          shopt -s extglob nullglob
          newest="$(for f in docs/releases/*.md; do basename "${f}" .md; done | sort -V | tail -n 1)"
          case "${newest}" in
            +([0-9]).+([0-9]).+([0-9]) ) prerelease=false ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) ) prerelease=true ;;
            *) echo "No release notes named after a version; nothing to publish."; exit 0 ;;
          esac
          if [[ -n "$(git ls-remote --tags origin "refs/tags/${newest}")" ]]; then
            echo "${newest} is already tagged; nothing to publish."
            exit 0
          fi
          echo "Will publish ${newest} (prerelease: ${prerelease})."
          echo "version=${newest}" >> $GITHUB_OUTPUT
          echo "prerelease=${prerelease}" >> $GITHUB_OUTPUT

  # The release appears as soon as the Windows files are built; the macOS and
  # Linux files are added to it when their builds finish. That is why this job
  # does not wait for build-project: it watches this run's artifacts instead
  # (.github/scripts/publish-release.sh).
  publish-release:
    name: Publish Release 🚀
    needs: pending-release
    if: needs.pending-release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Out Release Notes 📝
        uses: actions/checkout@v4
        with:
          path: repo-source
          sparse-checkout: |
            docs/releases
            .github/scripts

      - name: Publish Release 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pending-release.outputs.version }}
          PRERELEASE: ${{ needs.pending-release.outputs.prerelease }}
        run: |
          : Publish Release 🚀
          name="$(jq -r '.displayName // .name' repo-source/buildspec.json)"
          bash repo-source/.github/scripts/publish-release.sh \
            "repo-source/docs/releases/${VERSION}.md" "${name} ${VERSION}"
