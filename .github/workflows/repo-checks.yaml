name: Repository checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  root-allowlist:
    name: Root allowlist 🧹
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the repository root
        run: bash scripts/check-root.sh
