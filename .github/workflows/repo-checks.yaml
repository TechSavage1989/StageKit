name: Repository checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  root-allowlist:
    name: Root allowlist 🧹
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the repository root
        run: bash scripts/check-root.sh
      - name: Check setting names in the guide
        run: python3 scripts/check-guide-settings.py
      - name: Check the built-in icon library
        run: python3 scripts/make-view-icon-library.py --check
      - name: Check public Windows update order
        run: bash tests/check-release-order.sh
