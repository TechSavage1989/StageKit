name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

      - name: Show the formatter patch
        if: failure()
        shell: bash
        run: |
          ./build-aux/run-clang-format src/transition/item-morph.cpp tests/show-in-scenes-camera.hpp
          echo STAGEKIT_FORMAT_PATCH_BEGIN
          git diff --no-color -- src tests
          echo STAGEKIT_FORMAT_PATCH_END

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
