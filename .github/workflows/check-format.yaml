name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

      - name: Inspect formatted changes
        if: always()
        run: |
          for path in src/common/alpha-bounds.hpp src/placement/fit-engine.cpp src/dock/arrange.cpp src/ambient/ambient-background.cpp tests/alpha-bounds-test.cpp; do
            if clang-format-19 "$path" > "$RUNNER_TEMP/formatted.cpp"; then
              cp "$RUNNER_TEMP/formatted.cpp" "$path"
            fi
          done
          git diff -U2 -- src tests
  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
