name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

      - name: Collect formatted clock controls
        if: always()
        run: |
          for f in src/countdown/clock-picker.cpp src/countdown/clock-picker.hpp src/countdown/timer-options.cpp tests/countdown-dock-test.hpp; do
            printf 'CLOCK_FORMAT %s ' "$f"
            clang-format-19 "$f" | base64 -w0
            echo
          done
  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
