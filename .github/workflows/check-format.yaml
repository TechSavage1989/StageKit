name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

      - name: Read formatted countdown sources for this pull request
        if: always() && github.head_ref == 'feat/countdown-timer'
        run: |
          for f in src/countdown/*.cpp src/countdown/*.hpp tests/countdown*-test.hpp; do
            echo "COUNTDOWN_FORMAT $f $(clang-format "$f" | base64 -w0)"
          done

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
