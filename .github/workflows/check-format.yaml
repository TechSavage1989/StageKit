name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error


      - name: Temporary formatting diagnostic
        if: always()
        shell: bash
        run: |
          /home/linuxbrew/.linuxbrew/opt/clang-format@19/bin/clang-format -i src/controller/views-dock.cpp tests/control-panel-test.hpp
          git diff -- src/controller/views-dock.cpp tests/control-panel-test.hpp

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
