name: Check Code Formatting 🛠️
on:
  workflow_call:
jobs:
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: clang-format check 🐉
        id: clang-format
        uses: ./.github/actions/run-clang-format
        with:
          failCondition: error

      - name: Collect formatted changes for review
        if: always()
        run: |
          formatter="$(command -v clang-format-19 || command -v clang-format)"
          python3 - "$formatter" <<'PY'
          from pathlib import Path
          import base64, subprocess, sys
          files = 'src/countdown/timer-source.hpp src/common/box-alignment.hpp src/dock/alignment-grid.hpp src/countdown/countdown.hpp src/countdown/timer-line.hpp src/countdown/timer-options.cpp src/countdown/countdown.cpp src/countdown/countdown-dock.cpp tests/countdown-test.hpp tests/countdown-dock-test.hpp'.split()
          for name in files:
              path = Path(name)
              text = subprocess.check_output([sys.argv[1], str(path)])
              data = base64.b64encode(text).decode()
              for i in range(0, len(data), 12000):
                  print('TIMER_FORMAT', name, i, data[i:i+12000])
          PY

  gersemi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gersemi Check 🎛️
        id: gersemi
        uses: ./.github/actions/run-gersemi
        with:
          failCondition: error
