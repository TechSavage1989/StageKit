name: Validate review stage 6
on:
  push:
    branches: [chore/review-stage6]
concurrency:
  group: review-stage6-working-branch
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format changed sources with the repository style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install --quiet clang-format==19.1.7 gersemi
          "$RUNNER_TEMP/format/bin/clang-format" -i $(git diff --name-only origin/main...HEAD -- '*.cpp' '*.hpp')
          "$RUNNER_TEMP/format/bin/gersemi" --check CMakeLists.txt tests/CMakeLists.txt
          bash scripts/check-root.sh
          python3 scripts/check-guide-settings.py
          ! grep -E '^[A-Za-z]' data/locale/en-US.ini | cut -d= -f1 | sort | uniq -d | grep .
          for changed in $(git diff --name-only); do
            expected=$(git hash-object "$changed")
            actual=$(python3 -c 'import base64,json,sys; print(json.dumps(dict(encoding="base64",content=base64.b64encode(open(sys.argv[1],"rb").read()).decode())))' "$changed" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$actual" = "$expected"
            echo "formatted file $actual $changed"
          done
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS development and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libobs-dev obs-studio qt6-base-dev libgl1-mesa-dri xvfb xauth python3-pil valgrind
      - name: Build the plugin and headless test
        run: |
          cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build-tests --parallel 3 --target stagekit stagekit-ambient-test
      - name: Exercise saved scenes, transitions and operator controls
        run: |
          out="$PWD/build-tests/out"
          mkdir -p "$out/tooltips"
          python3 tests/make-test-image.py "$out"
          failed=0
          for gate in LAYOUT MODE_PLACE SWITCH_COMMAND AUTO_FRAME_SWITCHER CAPTURE_HIDE SCENE_TRANS_OVERRIDE MORPH; do
            env "STAGEKIT_TEST_ONLY_${gate}=1" xvfb-run -a build-tests/tests/stagekit-ambient-test "$PWD/build-tests/stagekit.so" "$PWD/data" "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out/tooltips" "$out/test-title.png" "$out/tooltips" "$out/test-pillarbox.png" "$out/test-black.png" "$out/test-dark-game.png" > "$out/$gate.log" 2>&1 || failed=1
            echo "$gate"
            grep -E 'FAIL|ALL PASSED|Assertion' "$out/$gate.log" | tail -28 || true
          done
          exit "$failed"
      - name: Check rebuilt controls for invalid memory accesses
        if: always() && hashFiles('build-tests/tests/stagekit-ambient-test') != ''
        run: |
          out="$PWD/build-tests/out"
          mkdir -p "$out/tooltips"
          python3 tests/make-test-image.py "$out"
          result=0
          env STAGEKIT_TEST_ONLY_SCENE_TRANS_OVERRIDE=1 xvfb-run -a valgrind --tool=memcheck --leak-check=no --undef-value-errors=no --error-exitcode=86 --log-file="$out/valgrind.log" build-tests/tests/stagekit-ambient-test "$PWD/build-tests/stagekit.so" "$PWD/data" "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out/tooltips" "$out/test-title.png" "$out/tooltips" "$out/test-pillarbox.png" "$out/test-black.png" "$out/test-dark-game.png" > "$out/valgrind-test.log" 2>&1 || result=$?
          grep -E -A12 'Invalid read|Invalid write|Invalid free|ERROR SUMMARY' "$out/valgrind.log" | head -110 || true
          test "$result" = 0 || { test "$result" = 1 && grep -q 'ERROR SUMMARY: 0 errors' "$out/valgrind.log"; }
