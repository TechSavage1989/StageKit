name: Prepare pinned OBS component sources
on:
  push:
    branches: [feat/obs-filter-replacements]
    paths: ['.github/workflows/prepare-replacement-ports.yml', 'src/third-party/ports/origins.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source revisions and notices
        run: python3 scripts/import-obs-ports.py
      - name: Record the sources on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/third-party/ports data/components
          git diff --cached --quiet && exit 0
          git commit -m "Vendor the pinned OBS effects and utility sources with their notices"
          git push origin HEAD:refs/heads/feat/obs-filter-replacements
