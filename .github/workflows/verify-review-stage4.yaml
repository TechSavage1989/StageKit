name: Validate Stream Deck review
on:
  push:
    branches: [chore/review-stage4]
permissions:
  contents: read
jobs:
  deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the build dependencies
        working-directory: streamdeck
        run: |
          npm ci
          python3 -m venv "$RUNNER_TEMP/graphics"
          "$RUNNER_TEMP/graphics/bin/pip" install --quiet Pillow==11.3.0
      - name: Generate the property inspectors and key artwork
        working-directory: streamdeck
        run: |
          py="$RUNNER_TEMP/graphics/bin/python"
          "$py" tools/make-option-icons.py
          "$py" tools/make-badges.py
          "$py" - <<'PY'
          import importlib.util, json
          from pathlib import Path
          def load(name):
              spec = importlib.util.spec_from_file_location(name, "tools/" + name + ".py")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod
          names = {"match-item", "scene-transitions", "style-make-room", "ratio-16x15"}
          ids = {"options/" + item for item in names}
          path = Path("src/pack.json")
          all_text = path.read_bytes()
          try:
              narrowed = json.loads(all_text)
              narrowed["pictures"] = [p for p in narrowed["pictures"] if p["id"] in ids]
              assert len(narrowed["pictures"]) == len(ids)
              path.write_text(json.dumps(narrowed), encoding="utf-8")
              load("make-state-icons").main()
          finally:
              path.write_bytes(all_text)
          keys = {"scenetransitions", "matchitem"}
          actions = load("make-action-icons")
          actions.ICONS = {k: v for k, v in actions.ICONS.items() if k in keys}
          actions.main()
          svg = load("make-svgs")
          svg.ACTIONS.ICONS = actions.ICONS
          svg.OPTIONS.DRAWINGS = {k: v for k, v in svg.OPTIONS.DRAWINGS.items() if k in names}
          svg.action_icons()
          svg.key_pictures()
          PY
          "$py" tools/make-plugin-files.py
      - name: Record the regenerated file objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, subprocess
          from pathlib import Path
          root = "streamdeck/com.techsavage1989.stagekit.sdPlugin"
          generated = ["streamdeck/src/pack.json", "streamdeck/src/badges.json", root + "/manifest.json"]
          generated += [p.as_posix() for p in Path(root + "/ui").glob("*.html")]
          new = subprocess.check_output(["git","ls-files","--others","--exclude-standard","--",root+"/imgs","streamdeck/svg"]).decode().splitlines()
          generated.extend(p for p in new if p.endswith((".png",".svg")))
          def save(path):
              data = Path(path).read_bytes()
              want = hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              body = json.dumps(dict(encoding="base64",content=base64.b64encode(data).decode())).encode()
              result = subprocess.run(["gh","api","--method","POST","repos/"+os.environ["GITHUB_REPOSITORY"]+"/git/blobs","--input","-","--jq",".sha"],input=body,stdout=subprocess.PIPE,check=True)
              assert want == result.stdout.decode().strip()
              return "generated file " + want + " " + path
          changed = set(subprocess.check_output(["git","diff","--name-only","--","streamdeck"]).decode().splitlines()) | set(new)
          for row in concurrent.futures.ThreadPoolExecutor(max_workers=2).map(save, sorted(set(generated) & changed)):
              print(row,flush=True)
          PY
      - name: Exercise the generated inspectors and the OBS WebSocket protocol
        if: always()
        working-directory: streamdeck
        run: npm test
      - name: Typecheck, compile and package
        if: always()
        working-directory: streamdeck
        run: |
          npm run build
          npm run validate
          npm run pack
