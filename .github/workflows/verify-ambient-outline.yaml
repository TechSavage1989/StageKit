name: Validate outline rendering
on:
  push:
    branches: [feat/outline-ambient-fill]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate, baseline]
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && '2ae2caf6eab0d8c76ee997489d7a25d03798ad19' || github.sha }}
      - name: Check formatting of files changed by both outline updates
        if: matrix.revision == 'candidate'
        run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install --quiet clang-format==19.1.7 gersemi
          "$RUNNER_TEMP/format/bin/clang-format" -i tests/ambient-test.cpp src/ambient/ambient-{background,frame}.{cpp,hpp} src/look/{look-paint,outline-ambient}.{cpp,hpp} src/look/scene-shadow.cpp src/shadow/shadow-backdrop.cpp src/plugin-main.cpp
          git diff --exit-code --unified=4
          "$RUNNER_TEMP/format/bin/gersemi" --check CMakeLists.txt tests/CMakeLists.txt
          bash scripts/check-root.sh
          ! grep -E '^[A-Za-z]' data/locale/en-US.ini | cut -d= -f1 | sort | uniq -d | grep .
      - name: Install OBS development and rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libobs-dev obs-studio qt6-base-dev libgl1-mesa-dri xvfb xauth python3-pil fonts-dejavu-core
      - name: Build the plugin and headless render test
        run: |
          cmake -S . -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build build-tests --parallel 3 --target stagekit stagekit-ambient-test
      - name: Render the Ambient Background outline and preview
        run: |
          mkdir -p build-tests/out/{tooltips,outline-ambient,outline-bleed,outline-patterns,outline-glow,outline-designs,hex-patterns}
          python3 tests/make-test-image.py build-tests/out
          out="$PWD/build-tests/out"
          if [ "${{ matrix.revision }}" = baseline ]; then exit 0; fi
          env STAGEKIT_TEST_ONLY_OUTLINE_AMBIENT=1 xvfb-run -a build-tests/tests/stagekit-ambient-test "$PWD/build-tests/stagekit.so" "$PWD/data" "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out/tooltips" "$out/test-title.png" "$out/tooltips" "$out/test-pillarbox.png" "$out/test-black.png" "$out/test-dark-game.png" > "$out/ambient.log" 2>&1 || { tail -100 "$out/ambient.log"; exit 1; }
          grep -E 'PASS|FAIL' "$out/ambient.log" | tail -8
          python3 tests/make-sheet.py "$out/outline-ambient" "$out/outline-ambient.png" 4 light
      - uses: actions/upload-artifact@v4
        if: matrix.revision == 'candidate'
        with:
          name: ambient-outline-preview
          path: build-tests/out/outline-ambient.png
      - name: Exercise adjacent outline cases
        run: |
          out="$PWD/build-tests/out"
          failed=0
          gates="OUTLINE_BLEED OUTLINE_GLOW OUTLINE_PATTERNS OUTLINE_DESIGNS HEX_PATTERNS"
          if [ "${{ matrix.revision }}" = baseline ]; then gates="OUTLINE_GLOW"; fi
          for gate in $gates; do
            env "STAGEKIT_TEST_ONLY_${gate}=1" STAGEKIT_TEST_BLEED_QUICK=0 xvfb-run -a build-tests/tests/stagekit-ambient-test "$PWD/build-tests/stagekit.so" "$PWD/data" "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out/tooltips" "$out/test-title.png" "$out/tooltips" "$out/test-pillarbox.png" "$out/test-black.png" "$out/test-dark-game.png" > "$out/$gate.log" 2>&1 || failed=1
            echo "$gate"
            grep -E '^(PASS|FAIL)|ALL PASSED|failed:|^error:' "$out/$gate.log" | awk '/^error:/ {if (!seen[$0]++ && n++ < 6) print; next} /FAIL|ALL PASSED/ {print}' | head -100 || true
          done
          exit "$failed"
  save-preview:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44768044274
          name: ambient-outline-preview
          path: preview
      - name: Store the verified PNG for the guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file preview/outline-ambient.png
          python3 -c 'import base64,json,pathlib; print(json.dumps(dict(encoding="base64",content=base64.b64encode(pathlib.Path("preview/outline-ambient.png").read_bytes()).decode())))' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha
