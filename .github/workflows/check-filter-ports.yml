name: Check StageKit replacement filters
on:
  pull_request:
    paths:
      - '.github/workflows/check-filter-ports.yml'
      - 'CMakeLists.txt'
      - 'cmake/common/stagekit-ports.cmake'
      - 'data/components/**'
      - 'data/effects/stagekit-*.effect'
      - 'data/locale/en-US.ini'
      - 'data/ports.json'
      - 'scripts/*obs-ports.py'
      - 'src/components/**'
      - 'src/common/alpha-bounds.hpp'
      - 'src/ambient/ambient-background.cpp'
      - 'src/placement/fit-engine.cpp'
      - 'src/dock/arrange.cpp'
      - 'src/look/scene-shadow.cpp'
      - 'tests/alpha-bounds-test.cpp'
      - 'src/countdown/**'
      - 'src/capture/app-capture.cpp'
      - 'src/frame/**'
      - 'src/api/vendor-api.cpp'
      - 'src/common/item-transition.*'
      - 'src/placement/show-in-scenes.*'
      - 'src/placement/scene-transitions.*'
      - 'src/transition/**'
      - 'src/view/cropped-view.*'
      - 'tests/show-in-scenes-camera.hpp'
      - 'tests/countdown*-test.hpp'
      - 'tests/reset-stats-test.hpp'
      - 'tests/studio-transition-test.hpp'
      - 'tests/auto-frame-detection-test.hpp'
      - 'tests/window-morph-test.hpp'
      - 'tests/capture-settings-test.hpp'
      - 'src/plugin-main.cpp'
      - 'src/third-party/ports/**'
      - 'streamdeck/**'
      - 'tests/CMakeLists.txt'
      - 'tests/*replacement*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check visible pixel bounds
        run: |
          c++ -std=c++17 -O2 tests/alpha-bounds-test.cpp -o "$RUNNER_TEMP/alpha-bounds"
          "$RUNNER_TEMP/alpha-bounds"
      - name: Install OBS development files
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update -qq
          sudo apt-get install -y libsimde-dev obs-studio qt6-base-dev qt6-base-private-dev qt6-svg-dev gdb libcurl4-openssl-dev ninja-build xvfb xauth libgl1-mesa-dri python3-pil
      - name: Build plugin and source ports
        run: |
          cmake -S . -B build-ports -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON
          cmake --build build-ports --parallel 4 -- -k 0
      - name: Test collection migration and render the filters
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/filter-results"
          python3 tests/replacement-images.py "$out"
          cp tests/replacement-invert.effect "$out/invert.effect"
          build-ports/tests/stagekit-replacement-collection-test data/ports.json data
          xvfb-run -a build-ports/tests/stagekit-replacement-test "$PWD/build-ports/stagekit.so" "$PWD/data" "$out/art.png" "$out" > "$out/render.log" 2>&1 || { grep -E 'FAIL|shader error|error:.*effect|StageKit timer (at |layout:)' "$out/render.log" || true; tail -150 "$out/render.log"; xvfb-run -a gdb -q --batch -ex run -ex 'bt 30' --args build-ports/tests/stagekit-replacement-test "$PWD/build-ports/stagekit.so" "$PWD/data" "$out/art.png" "$out" > "$out/debug.log" 2>&1 || true; tail -50 "$out/debug.log"; exit 1; }
          grep -E 'PASS|FAIL|mean difference|window morph test|capture settings test|StageKit timer (at |layout:)' "$out/render.log"
          python3 tests/replacement-images.py "$out" sheet
      - name: Check saved visibility, restore rules and Make Room motion
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/camera-results"
          mkdir -p "$out"
          python3 tests/make-test-image.py "$out"
          for test in REVIEW_CONTROLS RESTORE_HIDDEN SWITCH_COMMAND MAKE_ROOM MORPH_HOLDS; do
            env "STAGEKIT_TEST_ONLY_$test=1" xvfb-run -a build-ports/tests/stagekit-ambient-test "$PWD/build-ports/stagekit.so" "$PWD/data" \
              "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out" > "$out/$test.log" 2>&1 || { grep -F "  FAIL  " "$out/$test.log" || true; tail -90 "$out/$test.log"; exit 1; }
            tail -3 "$out/$test.log"
          done
      - name: Check ambient lift and per-source shadow rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/camera-results"
          mkdir -p "$out" "$out/../darkest"
          python3 tests/make-test-image.py "$out"
          for test in AMBIENT_DARKEST SHADOW_EACH; do
            env "STAGEKIT_TEST_ONLY_$test=1" xvfb-run -a build-ports/tests/stagekit-ambient-test "$PWD/build-ports/stagekit.so" "$PWD/data" \
              "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out" > "$out/$test.log" 2>&1 || { grep -F 'FAIL' "$out/$test.log" || true; tail -50 "$out/$test.log"; exit 1; }
            tail -3 "$out/$test.log"
          done
      - name: Open the replacement catalog in a fresh OBS frontend
        if: always() && hashFiles('build-ports/tests/stagekit-replacement-probe.so') != ''
        run: bash tests/check-replacement-frontend.sh build-ports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stagekit-filter-render
          path: |
            build-ports/filter-results/filter-replacements.png
            build-ports/filter-results/native-scene-effects.png
            build-ports/filter-results/countdown-timer.png
            build-ports/filter-results/countdown-dock.png
            build-ports/filter-results/countdown-settings.png
            build-ports/filter-results/countdown-scaled.png
            build-ports/filter-results/countdown-layout.png
            build-ports/filter-results/countdown-rollover.png
            build-ports/filter-results/countdown-box.png
            build-ports/filter-results/auto-frame-detection.png
            build-ports/filter-results/auto-frame-scopes.png
            build-ports/filter-results/window-morph.png
            build-ports/filter-results/render.log
  windows:
    name: Windows OBS 32.2.2 frontend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo
      - run: python -m pip install --quiet pillow
      - name: Check the installed components in portable OBS
        shell: pwsh
        run: |
          cmake --build build_x64 --config RelWithDebInfo --target stagekit-replacement-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-ChildItem -Path build_x64 -Filter 'stagekit-replacement-probe.dll' -Recurse -File | Select-Object -First 1
          if (!$probe) { throw 'Missing test probe.' }
          New-Item -ItemType Directory -Path build_x64/frontend-results -Force | Out-Null
          $env:STAGEKIT_AUTO_FRAME_CAPTURE = Join-Path $PWD 'build_x64/frontend-results/auto-frame-detection.png'
          ./tests/check-replacement-windows.ps1 -PackageDirectory release/RelWithDebInfo/stagekit -ProbePath $probe.FullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stagekit-auto-frame-windows
          path: |
            build_x64/frontend-results/auto-frame-detection.png
            build_x64/frontend-results/auto-frame-scopes.png
  deck-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix streamdeck --quiet
      - name: Check the companion settings pages and key images
        run: |
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --quiet pillow
          cd streamdeck
          "$RUNNER_TEMP/icons/bin/python" tools/make-action-icons.py
          "$RUNNER_TEMP/icons/bin/python" tools/make-plugin-files.py
          plugin=com.techsavage1989.stagekit.sdPlugin
          paths=("$plugin/manifest.json")
          for key in obsfilter obssource obsmute obsstudio studiotransition obscamera movesourceport moveswapport timer resetstats measurebars rememberratio measureandremember; do
            paths+=("$plugin/ui/$key.html" "$plugin/imgs/actions/$key")
          done
          git diff --exit-code -- "${paths[@]}"
