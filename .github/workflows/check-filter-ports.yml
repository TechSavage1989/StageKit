name: Check StageKit replacement filters
on:
  push:
    branches: [feat/obs-filter-replacements]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS development files
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update -qq
          sudo apt-get install -y libsimde-dev obs-studio qt6-base-dev qt6-base-private-dev qt6-svg-dev libcurl4-openssl-dev ninja-build xvfb xauth libgl1-mesa-dri python3-pil
      - name: Build plugin and source ports
        run: |
          cmake -S . -B build-ports -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON
          cmake --build build-ports --parallel 4 -- -k 0
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format changed sources with the repository style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install --quiet clang-format==19.1.7 gersemi==0.21.0
          "$RUNNER_TEMP/format/bin/clang-format" -i src/components/*.cpp src/components/*.hpp src/dock/stagekit-dock.cpp $(find tests -name '*replacement*.cpp')
          "$RUNNER_TEMP/format/bin/gersemi" --in-place CMakeLists.txt tests/CMakeLists.txt cmake/common/stagekit-ports.cmake
          for changed in $(git diff --name-only); do
            expected=$(git hash-object "$changed")
            actual=$(python3 -c 'import base64,json,sys; print(json.dumps(dict(encoding="base64",content=base64.b64encode(open(sys.argv[1],"rb").read()).decode())))' "$changed" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$actual" = "$expected"
            echo "formatted file $actual $changed"
          done
