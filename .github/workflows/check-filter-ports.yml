name: Check StageKit replacement filters
on:
  pull_request:
    paths:
      - '.github/workflows/check-filter-ports.yml'
      - 'CMakeLists.txt'
      - 'cmake/common/stagekit-ports.cmake'
      - 'data/components/**'
      - 'data/effects/stagekit-*.effect'
      - 'data/locale/en-US.ini'
      - 'data/ports.json'
      - 'scripts/*obs-ports.py'
      - 'src/components/**'
      - 'src/common/alpha-bounds.hpp'
      - 'src/ambient/ambient-background.cpp'
      - 'src/placement/fit-engine.cpp'
      - 'src/dock/arrange.cpp'
      - 'src/look/scene-shadow.cpp'
      - 'tests/alpha-bounds-test.cpp'
      - 'src/countdown/**'
      - 'src/common/item-transition.*'
      - 'src/placement/show-in-scenes.*'
      - 'src/placement/scene-transitions.*'
      - 'src/transition/**'
      - 'src/view/cropped-view.*'
      - 'tests/show-in-scenes-camera.hpp'
      - 'tests/countdown*-test.hpp'
      - 'src/plugin-main.cpp'
      - 'src/third-party/ports/**'
      - 'streamdeck/**'
      - 'tests/CMakeLists.txt'
      - 'tests/*replacement*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check visible pixel bounds
        run: |
          c++ -std=c++17 -O2 tests/alpha-bounds-test.cpp -o "$RUNNER_TEMP/alpha-bounds"
          "$RUNNER_TEMP/alpha-bounds"
      - name: Install OBS development files
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update -qq
          sudo apt-get install -y libsimde-dev obs-studio qt6-base-dev qt6-base-private-dev qt6-svg-dev gdb libcurl4-openssl-dev ninja-build xvfb xauth libgl1-mesa-dri python3-pil
      - name: Build plugin and source ports
        run: |
          cmake -S . -B build-ports -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON
          cmake --build build-ports --parallel 4 -- -k 0
      - name: Test collection migration and render the filters
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/filter-results"
          python3 tests/replacement-images.py "$out"
          cp tests/replacement-invert.effect "$out/invert.effect"
          build-ports/tests/stagekit-replacement-collection-test data/ports.json data
          xvfb-run -a build-ports/tests/stagekit-replacement-test "$PWD/build-ports/stagekit.so" "$PWD/data" "$out/art.png" "$out" > "$out/render.log" 2>&1 || { grep -E 'FAIL|shader error|error:.*effect' "$out/render.log" || true; tail -150 "$out/render.log"; xvfb-run -a gdb -q --batch -ex run -ex 'bt 30' --args build-ports/tests/stagekit-replacement-test "$PWD/build-ports/stagekit.so" "$PWD/data" "$out/art.png" "$out" > "$out/debug.log" 2>&1 || true; tail -50 "$out/debug.log"; exit 1; }
          grep -E 'PASS|FAIL|mean difference' "$out/render.log"
          python3 tests/replacement-images.py "$out" sheet
      - name: Check saved visibility, restore rules and Make Room motion
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/camera-results"
          mkdir -p "$out"
          python3 tests/make-test-image.py "$out"
          for test in REVIEW_CONTROLS RESTORE_HIDDEN SWITCH_COMMAND MAKE_ROOM MORPH_HOLDS; do
            env "STAGEKIT_TEST_ONLY_$test=1" xvfb-run -a build-ports/tests/stagekit-ambient-test "$PWD/build-ports/stagekit.so" "$PWD/data" \
              "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out" > "$out/$test.log" 2>&1 || { grep -F "  FAIL  " "$out/$test.log" || true; tail -90 "$out/$test.log"; exit 1; }
            tail -3 "$out/$test.log"
          done
      - name: Check ambient lift and placement geometry
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/camera-results"
          mkdir -p "$out" "$out/../darkest"
          python3 tests/make-test-image.py "$out"
          for test in AMBIENT_DARKEST SHADOW_EACH SHADOW_FLICKER FIT_TOOL DOCK_BOUNDS; do
            env "STAGEKIT_TEST_ONLY_$test=1" xvfb-run -a build-ports/tests/stagekit-ambient-test "$PWD/build-ports/stagekit.so" "$PWD/data" \
              "$out/test-art.png" "$out/test-texture.png" "$out/test-game.png" "$out" > "$out/$test.log" 2>&1 || { grep -F 'FAIL' "$out/$test.log" || true; tail -50 "$out/$test.log"; exit 1; }
            tail -3 "$out/$test.log"
          done
      - name: Open the replacement catalog in a fresh OBS frontend
        if: always() && hashFiles('build-ports/tests/stagekit-replacement-probe.so') != ''
        run: bash tests/check-replacement-frontend.sh build-ports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stagekit-filter-render
          path: |
            build-ports/filter-results/filter-replacements.png
            build-ports/filter-results/native-scene-effects.png
            build-ports/filter-results/countdown-timer.png
            build-ports/filter-results/countdown-dock.png
            build-ports/filter-results/countdown-settings.png
            build-ports/filter-results/render.log
      - name: Compare scene collection frame times
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
          SCENES: Live
          FRAMES: '450'
          WARMUP: '5'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/after" "$RUNNER_TEMP/before"
          cp build-ports/stagekit.so "$RUNNER_TEMP/after/stagekit.so"
          git fetch --depth=1 origin 29505affb5a1b44681d0429b3fdea72726510eb6
          for path in src/ambient/ambient-background.cpp src/dock/arrange.cpp src/placement/fit-engine.cpp src/look/scene-shadow.cpp; do
            git show "FETCH_HEAD:$path" > "$path"
          done
          cmake --build build-ports --target stagekit --parallel 4
          cp build-ports/stagekit.so "$RUNNER_TEMP/before/stagekit.so"
          perf="$RUNNER_TEMP/measure"
          mkdir -p "$perf"
          python3 tests/make-perf-collection.py "$perf/scene.json" --scale 0.25 --scene-fit
          python3 - "$perf/scene.json" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]); scene=json.loads(p.read_text())
          for source in scene["sources"]:
              if source["id"] == "stagekit_ambient_background":
                  source["settings"].update(base_type=3, pattern=7, pattern_speed=97.0, pattern_scale=400.0, blur=500.0, pixel_style=2, pixel_size=50.0, darkest_level=50.0, darkest_fill=0, bloom=0.0)
              if source["id"] == "scene" and source["name"] == "Live":
                  source.setdefault("filters", []).append({"id":"stagekit_scene_shadow", "versioned_id":"stagekit_scene_shadow", "name":"Outline fixture", "enabled":True, "settings":{"shadow_from":1,"shadow":False,"outline":True,"outline_design":16,"outline_speed":600.0}})
          p.write_text(json.dumps(scene))
          PY
          fixtures="$PWD/build-ports/camera-results"
          for label in before after; do
            box="$perf/$label"
            mkdir -p "$box/out" "$box/darkest"
            for test in SHADOW_EACH AMBIENT_DARKEST; do
              env "STAGEKIT_TEST_ONLY_$test=1" xvfb-run -a build-ports/tests/stagekit-ambient-test "$RUNNER_TEMP/$label/stagekit.so" "$PWD/data" "$fixtures/test-art.png" "$fixtures/test-texture.png" "$fixtures/test-game.png" "$box/out" > "$box/$test.log" 2>&1 || { tail -40 "$box/$test.log"; exit 1; }
            done
          done
          python3 - "$perf" <<'PY'
          import pathlib, sys
          root=pathlib.Path(sys.argv[1])
          images=sorted((root/"before").rglob("*.rgba"))
          assert len(images) >= 5, "reference captures missing"
          for ref in images:
              name=ref.relative_to(root/"before")
              a=ref.read_bytes(); b=(root/"after"/name).read_bytes()
              assert len(a)==len(b) and len(a)>0, name
              difference=max(abs(x-y) for x,y in zip(a,b))
              print("IMAGE_COMPARISON",name,"max channel difference",difference)
              assert difference <= 1, name
          PY
          for label in before1 after1 after2 before2; do
            plugin="$RUNNER_TEMP/${label%?}/stagekit.so"
            OUT="$perf" PLUGIN="$plugin" bash tests/run-perf.sh build-ports "$label=$perf/scene.json" > "$perf/$label.txt"
            test -s "$perf/$label.json"
          done
          python3 tests/perf-compare.py "before1=$perf/before1.json" "after1=$perf/after1.json" "after2=$perf/after2.json" "before2=$perf/before2.json"
          python3 - "$perf" <<'PY'
          import json,sys,pathlib
          for name in ["before1","after1","after2","before2"]:
              data=json.loads((pathlib.Path(sys.argv[1])/(name+".json")).read_text())
              print("PERF_RESULT",name,json.dumps(data,separators=(",",":")))
          PY
  windows:
    name: Windows OBS 32.2.2 frontend
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo
      - run: python -m pip install --quiet pillow
      - name: Check the installed components in portable OBS
        shell: pwsh
        run: |
          cmake --build build_x64 --config RelWithDebInfo --target stagekit-replacement-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $probe = Get-ChildItem -Path build_x64 -Filter 'stagekit-replacement-probe.dll' -Recurse -File | Select-Object -First 1
          if (!$probe) { throw 'Missing test probe.' }
          ./tests/check-replacement-windows.ps1 -PackageDirectory release/RelWithDebInfo/stagekit -ProbePath $probe.FullName
  deck-assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix streamdeck --quiet
      - name: Check the companion settings pages and key images
        run: |
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --quiet pillow
          cd streamdeck
          "$RUNNER_TEMP/icons/bin/python" tools/make-action-icons.py
          "$RUNNER_TEMP/icons/bin/python" tools/make-plugin-files.py
          plugin=com.techsavage1989.stagekit.sdPlugin
          paths=("$plugin/manifest.json")
          for key in obsfilter obssource obsmute obsstudio obscamera movesourceport moveswapport; do
            paths+=("$plugin/ui/$key.html" "$plugin/imgs/actions/$key")
          done
          git diff --exit-code -- "${paths[@]}"
