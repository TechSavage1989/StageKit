name: Check StageKit replacement filters
on:
  push:
    branches: [feat/obs-filter-replacements]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS development files
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update -qq
          sudo apt-get install -y libsimde-dev obs-studio qt6-base-dev qt6-base-private-dev qt6-svg-dev gdb libcurl4-openssl-dev ninja-build xvfb xauth libgl1-mesa-dri python3-pil
      - name: Build plugin and source ports
        run: |
          cmake -S . -B build-ports -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON
          cmake --build build-ports --parallel 4 -- -k 0
      - name: Test collection migration and render the filters
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eu
          out="$PWD/build-ports/filter-results"
          python3 tests/replacement-images.py "$out"
          cp tests/replacement-invert.effect "$out/invert.effect"
          build-ports/tests/stagekit-replacement-collection-test data/ports.json data
          xvfb-run -a build-ports/tests/stagekit-replacement-test "$PWD/build-ports/stagekit.so" "$PWD/data" "$out/art.png" "$out" > "$out/render.log" 2>&1 || { tail -180 "$out/render.log"; exit 1; }
          grep -E 'PASS|FAIL|mean difference' "$out/render.log"
          python3 tests/replacement-images.py "$out" sheet
      - name: Capture the verified synthetic preview for the guide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sheet=build-ports/filter-results/filter-replacements.jpg
          result=$(python3 -c 'import base64,json,sys;print(json.dumps(dict(encoding="base64",content=base64.b64encode(open(sys.argv[1],"rb").read()).decode())))' "$sheet" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
          echo "rendered file $result docs/images/filter-replacements.jpg"
      - name: Open the replacement catalog in a fresh OBS frontend
        if: always() && hashFiles('build-ports/tests/stagekit-replacement-probe.so') != ''
        run: bash tests/check-replacement-frontend.sh build-ports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stagekit-filter-render
          path: |
            build-ports/filter-results/filter-replacements.jpg
            build-ports/filter-results/render.log
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Format changed sources with the repository style
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install --quiet clang-format==19.1.7 gersemi==0.21.0
          "$RUNNER_TEMP/format/bin/clang-format" -i src/components/*.cpp src/components/*.hpp src/dock/stagekit-dock.cpp $(find tests -name '*replacement*.cpp')
          "$RUNNER_TEMP/format/bin/gersemi" --in-place CMakeLists.txt tests/CMakeLists.txt cmake/common/stagekit-ports.cmake
          for changed in $(git diff --name-only); do
            expected=$(git hash-object "$changed")
            actual=$(python3 -c 'import base64,json,sys; print(json.dumps(dict(encoding="base64",content=base64.b64encode(open(sys.argv[1],"rb").read()).decode())))' "$changed" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$actual" = "$expected"
            echo "formatted file $actual $changed"
          done
  deck-assets:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate companion key pages and images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd streamdeck
          npm ci --quiet
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/icons/bin/python" tools/make-action-icons.py
          "$RUNNER_TEMP/icons/bin/python" tools/make-plugin-files.py
          cd ..
          plugin=streamdeck/com.techsavage1989.stagekit.sdPlugin
          files=("$plugin/manifest.json")
          for key in obsfilter obssource obsmute obsstudio obscamera movesourceport moveswapport; do
            files+=("$plugin/ui/$key.html" "$plugin/imgs/actions/$key/"*.png)
          done
          for path in "${files[@]}"; do
            actual=$(python3 -c 'import base64,json,sys;print(json.dumps(dict(encoding="base64",content=base64.b64encode(open(sys.argv[1],"rb").read()).decode())))' "$path" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            test "$actual" = "$(git hash-object "$path")"
            echo "generated file $actual $path"
          done
          cd streamdeck
          npm test
          npm run build
          npm run validate
