name: Check StageKit replacement filters
on:
  push:
    branches: [feat/obs-filter-replacements]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OBS development files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libobs-dev obs-studio qt6-base-dev qt6-base-private-dev qt6-svg-dev libcurl4-openssl-dev ninja-build xvfb
      - name: Build plugin and source ports
        run: |
          cmake -S . -B build-ports -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTAGEKIT_BUILD_TESTS=ON
          cmake --build build-ports --parallel 4
